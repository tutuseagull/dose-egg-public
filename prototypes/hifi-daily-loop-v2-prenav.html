    .map(([text, r]) => ({ text, score: r.n + r.near * 3 }))
    .sort((a, b) => b.score - a.score)
    .map(x => x.text);
}
/* history first, then the generic list for anything they have not tried yet */
function labelChoices(type){
  const mine = rankLabels(type);
  return mine.concat((SUGGEST[type] || []).filter(t => !mine.includes(t)));
}

function renderLogSheet(){
  let h = '';
  if (!logStep){
    h += '<h2>Add to today</h2>';
    /* Photo names itself, so it stays one tap to the shutter. Two doors to a
       camera (here and inside Food) is a deliberate bet, not an oversight:
       they lead to different records. Usage decides whether both survive. */
    h += `<button class="strip" onclick="pickPhoto('note')">
      <span><span class="strip-name">Photo</span> <span class="sub">· take one or pick from your album</span></span>
    </button>`;
    h += '<div class="grid">' + TILES.map(([t,ico,name]) =>
      `<button class="tile" onclick="openCategory('${t}')">
        <span class="tile-ico" style="background:var(--mark)"><i class="ph-fill ${ico}"></i></span>
        <span class="tile-name">${name}</span></button>`).join('') + '</div>';
  } else {
    h += `<div class="log-head">
        <button class="backbtn" onclick="openCategory(null)" aria-label="Back">
          <i class="ph ph-caret-left"></i></button>
        <h2>${TYPE_NAME[logStep]}</h2>
      </div>`;
    /* The camera leads the Food step — a photo is the fastest complete meal
       entry there is. It only appears here on a cold start, because once you
       have any food history the Food tile skips straight to the detail sheet,
       where the same camera sits at the top. Two ways in, one function. */
    if (logStep === 'meal'){
      h += `<button class="photo-add" onclick="pickPhoto('meal')">
        <i class="ph ph-camera"></i>
        <span class="strip-name">Log from a photo</span></button>`;
    }
    h += searchRowsHTML(logStep, null,
                        t => `logNamed('${logStep}',${q(t)})`,
                        `logNamed('${logStep}', searchQ.trim())`, 'search-log');
  }
  /* The crisis row is reachable from both steps — it is never a detour. */
  h += `<div class="quick-row">
      <button class="quick" onclick="quickLog(this,'Froze in place','symptom')">Froze in place</button>
      <button class="quick" onclick="quickLog(this,'Low energy','symptom')">Low energy</button>
    </div>`;
  el('log-body').innerHTML = h;
}
/* The app proposes when it can and asks when it cannot — one rule, two paths.
   With history: prefill the detail sheet with the likeliest entry, already a
   complete valid record, and let the user confirm by walking away or change
   anything in place. Tapping the tile then Done is two taps, the same as the
   chooser, except the user also had every detail in front of them.
   Without history: the chooser, because there is nothing honest to propose. */
function openCategory(t){
  searchQ = '';
  const guess = rankLabels(t)[0];
  if (!guess){ logStep = t; renderLogSheet(); return; }
  closeSheets();
  const e = { time:nowTime(), recorded:nowTime(), text:guess, type:t, basis:'asserted' };
  if (hasInterval(t)) e.anchor = 'end';   /* you log a workout after it ends */
  addEntry(e, 0);
  openDetail(e, 0);
}

/* Picking IS the log. Nothing opens afterwards. */
function logNamed(type, text){
  closeSheets();
  const e = { time:nowTime(), recorded:nowTime(), text, type, basis:'asserted' };
  if (hasInterval(type)) e.anchor = 'end';
  addEntry(e, 0);
}
function logOther(type){
  closeSheets();
  const e = { time:nowTime(), recorded:nowTime(), text:NEW_LABEL[type],
              type, basis:'asserted' };
  if (hasInterval(type)) e.anchor = 'end';
  addEntry(e, 0);
  openDetail(e, 0);
  startLabelEdit();
}

/* ═════════ photo ════════════════════════════════════════════════════════
   A photo is IDENTITY, not depth. It says a meal happened and roughly when —
   the part that must never be optional — and it says it faster than any list
   of chips can. What is on the plate is depth, and depth is what the app is
   allowed to guess at.

   So the read fills the note and the protein level, and marks both as GUESSES.
   A guess renders differently from an answer until you touch it, and it stays
   a guess if you never do. That is the honest state: "the app estimated this
   and the patient never disagreed" is not the same claim as "the patient said
   this", and the export is the reason the difference matters.

   Level, not grams, deliberately. A photo can support "looks like a lot of
   protein"; it cannot support "31 g". Grams stay the thing you type when you
   are actually counting [CONTEXT.meal].

   The read is simulated here. A real build sends the frame to a vision model —
   on-device first, since this is a photograph inside a health record. Every
   fifth photo comes back unreadable ON PURPOSE: a demo where the AI is always
   right is a demo of a product that does not exist, and the failure path is
   the one that needs designing. */
const READS = [
  { items:'Salmon, rice, green salad',      protein:'High' },
  { items:'Porridge with berries',          protein:'Low'  },
  { items:'Chicken sandwich, crisps',       protein:'Some' },
  { items:'Two eggs on toast',              protein:'Some' },
  { items:null,                             protein:null   },
];
let readN = 0;

/* The SAME shutter, a different question. Food has one obvious question — what
   is on the plate — so it is worth asking without being asked. An arbitrary
   photo does not: it might be a pill packet, a footpath, a rash, or nothing.
   Reading it unprompted would spend a model call and a privacy decision on a
   question nobody posed, so the generic photo waits for the button.
   What it can offer, once asked, is where the photo seems to belong — as a
   suggestion with a visible No, never as a silent re-filing. */
const NOTE_READS = [
  { caption:'A plate of pasta with tomato sauce', looks:'meal' },
  { caption:'A blister pack of tablets',          looks:'dose' },
  { caption:'A footpath through a park',          looks:'activity' },
  { caption:'A handwritten note on lined paper',  looks:null },
  { caption:null,                                 looks:null },
];
let noteReadN = 0;
let photoFor = null;        /* 'meal' | 'note' | the entry the shutter was opened from */

/* Clock-derived, because at 12:40 "Lunch" is a better first guess than "Food"
   and the name sits under a pencil either way — it never claims to be settled. */
function mealNameNow(){
  const h = new Date().getHours();
  return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch'
       : h < 17 ? 'Snack'     : h < 21 ? 'Dinner' : 'Snack';
}

function pickPhoto(target){
  photoFor = target;
  const inp = el('photo-in');
  inp.value = '';           /* so re-picking the same file still fires change */
  inp.click();
}

function onPhotoPicked(input){
  const f = input.files && input.files[0];
  if (!f) return;                    /* cancelled — nothing happened, so say nothing */
  let e = photoFor;
  if (photoFor === 'meal' || photoFor === 'note'){
    closeSheets();
    e = photoFor === 'meal'
      ? { time:nowTime(), recorded:nowTime(), text:mealNameNow(), type:'meal', basis:'asserted' }
      : { time:nowTime(), recorded:nowTime(), text:'Photo',       type:'note', basis:'asserted' };
    addEntry(e, 0);
    openDetail(e, 0);
  }
  e.photo = URL.createObjectURL(f);
  applyPhotoTime(e, f);
  if (e.type === 'meal') startRead(e);   /* food reads itself; everything else asks first */
  renderDetail(); renderTimeline();
}

/* The photo carries its own timestamp, and it is a better answer than "now" for
   anything logged after the fact. Three guards, all of them about not
   overwriting something truer:
     - only when the time is still the one the app filled in (time === recorded)
     - only within today, because crossing midnight is the day picker's job
     - only when the shot is more than five minutes old, since "just took it"
       already means now and re-stating it would be noise. */
function applyPhotoTime(e, f){
  if (!f.lastModified || e.time !== e.recorded) return;
  const d = new Date(f.lastModified);
  if (d.toDateString() !== new Date().toDateString()) return;
  const mins = d.getHours() * 60 + d.getMinutes();
  if (toMin(nowTime()) - mins < 5) return;
  e.time = fromMin(mins);
  e.recorded = nowTime();
  e.photoTime = true;
  sortDay(DAYS[0]);
}

function startRead(e){
  e.reading = true;
  const r = READS[readN % READS.length]; readN++;
  setTimeout(() => {
    e.reading = false;
    e.read = r.items ? 'ok' : 'failed';
    if (r.items){
      e.guess = e.guess || {};
      /* never overwrite something already there — a guess may fill a blank, it
         may not correct a person */
      if (!e.note){ e.note = r.items; e.guess.note = true; }
      e.fields = e.fields || {};
      if (e.fields.protein == null && e.fields.proteinG == null){
        e.fields.protein = r.protein; e.guess.protein = true;
      }
    }
    if (active && active.e === e) renderDetail();
    renderTimeline();
  }, 1400);
}

/* The asked-for read. Returns a caption and, when it can, a guess at where the
   photo belongs — offered as a question with a No next to it. Moving someone's
   record into a different category on a model's say-so is not a suggestion, it
   is a decision, and it is not ours to make. */
function readPhoto(e){
  e.reading = true; e.read = null;
  renderDetail();
  const r = NOTE_READS[noteReadN % NOTE_READS.length]; noteReadN++;
  setTimeout(() => {
    e.reading = false;
    e.read = r.caption ? 'ok' : 'failed';
    if (r.caption){
      e.guess = e.guess || {};
      if (!e.note){ e.note = r.caption; e.guess.note = true; }
      if (r.looks && r.looks !== e.type) e.looks = r.looks;
    }
    if (active && active.e === e) renderDetail();
    renderTimeline();
  }, 1400);
}

function convertTo(t){
  const e = active.e;
  e.type = t;
  delete e.looks;
  /* "Photo" described the record, not the thing. Once it is a meal it needs a
     meal's name — and the name sits under a pencil, so it stays arguable. */
  if (e.text === 'Photo') e.text = (t === 'meal') ? mealNameNow() : NEW_LABEL[t];
  if (hasInterval(t) && !e.anchor) e.anchor = 'end';
  /* now that we know it is food, the plate is worth a second look */
  if (t === 'meal' && !(e.fields && e.fields.protein != null)){ startRead(e); }
  renderDetail(); renderTimeline();
}
function dismissLooks(){ delete active.e.looks; renderDetail(); }

function photoSectionHTML(e){
  if (e.type !== 'meal' && e.type !== 'note') return '';
  /* On a meal the photo is depth: the entry is complete without it, and the
     header has to say so in the same word Details uses. On a plain photo entry
     it is the record itself, so no qualifier. */
  const opt = (e.type === 'meal') ? ' <span class="sec-opt">· optional</span>' : '';
  let h = `<div class="sec"><div class="sec-h">Photo${opt}</div>`;
  if (!e.photo){
    /* One line. What the read does is explained by the read itself, a second
       later — saying it in advance is the interface narrating its own feature. */
    h += `<button class="photo-add" onclick="pickPhoto(active.e)">
      <i class="ph ph-camera"></i>
      <span class="strip-name">Log from a photo</span></button>`;
  } else {
    h += `<img class="photo-shot" src="${e.photo}" alt="Photo of this meal">`;
    if (e.photoTime)
      h += `<div class="read-line"><i class="ph ph-clock"></i><span>Time taken from the photo: ${e.time}</span></div>`;
    if (e.reading)
      h += `<div class="read-line busy"><i class="ph ph-circle-notch"></i><span>Reading the photo…</span></div>`;
    else if (e.read === 'failed')
      h += `<div class="read-line"><i class="ph ph-eye-slash"></i><span>Couldn’t read this one. The photo is saved. Add the rest yourself if you want to.</span></div>`;
    else if (e.read === 'ok')
      /* the ≈ line only makes sense where there is an ≈ on screen — a plain
         photo produces a caption and nothing else, so it gets its own sentence */
      h += e.type === 'meal'
        ? `<div class="read-line"><i class="ph ph-magic-wand"></i><span>Read from the photo. <b class="est">&#8776;</b> means we guessed. Tap it to correct, or leave it.</span></div>`
        : `<div class="read-line"><i class="ph ph-magic-wand"></i><span>Caption read from the photo. Edit it below if it is off.</span></div>`;

    /* On a plain photo the read is a button, not a reflex. Offered again after
       a failure, because "try again" is a reasonable thing to want and a
       dead end is not. */
    if (e.type !== 'meal' && !e.reading && e.read !== 'ok'){
      h += `<button class="photo-add" onclick="readPhoto(active.e)">
        <i class="ph ph-magic-wand"></i>
        <span class="strip-name">${e.read === 'failed' ? 'Try reading it again' : 'Read this photo'}</span></button>`;
    }
    if (e.looks){
      h += `<div class="read-line"><i class="ph ph-question"></i><span>This looks like
              <b>${TYPE_NAME[e.looks]}</b>. Move it there?</span></div>`;
      h += `<div class="chips">
        <button class="chip pick" onclick="convertTo('${e.looks}')">Make it ${TYPE_NAME[e.looks]}</button>
        <button class="chip pick" onclick="dismissLooks()">No, leave it</button></div>`;
    }
  }
  return h + '</div>';
}

/* Taking a value makes it yours. Grams and level are two precisions of one
   fact, so answering either one clears the guess on both. */
function ownIt(key){
  const g = active && active.e.guess; if (!g) return;
  delete g[key];
  if (key === 'protein')  delete g.proteinG;
  if (key === 'proteinG') delete g.protein;
}

/* ═════════ time entry ═══════════════════════════════════════════════════
   Three ranges, three mechanisms, escalating only as far as needed:

     just happened   → nudges (±15m / ±1h). Nunes et al. 2016 (DG5) found
                       people with PD do better with multiple-tap than drag,
                       so a stepper beats a wheel. But DG3 caps multiple-tap
                       at ~10 taps before fatigue, which is exactly why nudges
                       alone cannot reach "yesterday afternoon".
     earlier today   → tap the time, type it. Numeric keypad, no drag anywhere.
     another day     → day chips.

   Nothing is hidden behind the escalation: all three are on screen at once.
   The date-entry accessibility literature is consistent that a picker widget
   must always be optional and typing must always be possible. */

/* You cannot already have done something you have not done yet. Today is
   clamped to the current time; yesterday needs no clamp because every time
   yesterday is in the past. Scheduled-but-unrealised doses are the one thing
   that legitimately sits in the future, and they live on the confirmation
   card, not in this sheet — so nothing here needs an exemption. */
function canNudge(mins){
  const t = toMin(active.e.time);
  if (mins < 0) return t + mins >= 0;
  if (active.day !== 0) return true;
  return t + mins <= toMin(nowTime());
}
const isNow = () => active.day === 0 && active.e.time === nowTime();

function timeSectionHTML(e){
  const lag = lagLabel(e);
  const anchored = hasInterval(e.type);

  /* "Ended · Today · 19:00" — the qualifiers stay collapsed until tapped.
     Both lists are 2 items, below STEP_THRESHOLD, so they open inline. */
  let mini = '<div class="minirow">';
  if (anchored){
    mini += `<button class="minibtn" onclick="toggleMini('anchor')">
      <span>${e.anchor === 'start' ? 'Started' : 'Ended'}</span>
      <i class="ph ph-caret-down"></i></button><span class="minisep">·</span>`;
  }
  /* Pencil, not caret: this one opens a step now. */
  mini += `<button class="minibtn step" onclick="openPicker('day')" aria-label="Change the day">
      <span>${esc(dayName(active.day))}</span><i class="ph ph-pencil-simple"></i></button>`;
  mini += '</div>';

  if (openMini === 'anchor')
    mini += '<div class="chips">' + [['start','Started at'],['end','Ended at']].map(([v,l]) =>
      `<button class="chip pick${(e.anchor||'end')===v?' on':''}" onclick="setAnchor('${v}')">${l}</button>`
    ).join('') + '</div>';

  /* The time no longer swaps itself for fields in place. Same affordance as the
     name, so: same behaviour. The nudges stay out here rather than moving into
     the step, because they are not editing — they are one-tap corrections, and
     burying the most common one behind a screen would cost a tap to save a tap. */
  const face = `<button class="timeval-btn" onclick="openPicker('time')" aria-label="Edit the time">
         <span class="timeval">${e.time}</span><i class="ph ph-pencil-simple"></i>
       </button>`;

  /* "+1h" gave up its slot to "Now", 2026-08-11. It was the most-often-disabled
     button on the row — anything logged near the present time cannot move an
     hour forward — and Now is the jump people actually reach for. Marked apart
     because it is a jump, not an increment.
     Now is never disabled. A disabled control asks the user to work out WHY it
     is dead; an idempotent one just does nothing when it is already true. That
     costs a wasted tap at worst, and the wasted tap is cheaper than the puzzle. */
  const nudges = [[-60,'\u22121h'],[-15,'\u221215m'],[15,'+15m']].map(([m,l]) =>
      `<button class="nudge" onclick="nudge(${m})"${canNudge(m)?'':' disabled'}>${l}</button>`
    ).join('')
    + `<button class="nudge" onclick="setNow()">Now</button>`;

  /* Header is static and generic; the row below carries the specifics.
     It used to read "When it ended" above a row reading "Ended · Today", which
     said "ended" twice — and of the two, the row is the one worth keeping,
     because it is tappable. A header that restates a control is a header doing
     the control's job badly. "When" also runs parallel to "How long". */
  return `<div class="sec"><div class="sec-h">When</div>
    ${mini}
    ${face}
    ${lag ? `<div class="timesub">Logged at ${lag}</div>` : ''}
    <div class="nudges">${nudges}</div>
  </div>`;
}

/* Duration gets the same treatment as the time: its own section, a few
   shortcuts ranked by what this user actually logs, and one door to the rest.
   Previously it was a lone "Add" chip in a different visual idiom. */
function durationSectionHTML(e){
  const f = (CONTEXT[e.type] || []).find(x => x.temporal);
  if (!f) return '';
  const v = e.fields && e.fields[f.key];
  /* WHICH three: by how often this user picks them. IN WHAT ORDER: by size.
     Frequency ranking is right for categorical values, where there is no
     natural order to violate — but 20, 10, 30 reads as broken, because numbers
     carry their own order and the eye expects it. So: relevance chooses the
     set, magnitude arranges it. Three plus More… keeps the row to four, which
     fits on one line on a wider phone and wraps gracefully on a narrow one. */
  const pool = rankField(e.type, f.key)
                 .concat(f.choices.filter(c => !rankField(e.type, f.key).includes(c)));
  const picks = (v ? [v] : []).concat(pool.filter(c => c !== v))
                  .slice(0, 3).sort((a, b) => a - b);
  /* Tapping the selected chip re-sets the same value rather than clearing it.
     A single-select group that empties when you tap the current choice is a
     destructive action hiding inside an ordinary-looking one — and the same
     reasoning as "Now": idempotent beats surprising. */
  const chips = picks.map(c =>
      `<button class="chip pick${c===v?' on':''}" onclick="pickField('${f.key}',${c})">${fmtDur(c)}</button>`)
    .concat([`<button class="chip more" onclick="openPicker('field','${f.key}')">More<i class="ph ph-caret-right"></i></button>`]);
  return `<div class="sec"><div class="sec-h">${f.label}</div>
    <div class="chips">${chips.join('')}</div></div>`;
}

/* One exit only — back. Every choice commits the moment it is tapped, so there
   is nothing to confirm and no second Done competing with the sheet's own.
   Two shapes, chosen by what KIND of data the field holds — not by how many
   options it has, which was the earlier rule and the cruder one:
     open-ended categorical → search + rows + add-your-own
     numeric / temporal     → type the number + shortcuts (searching numbers
                              is nonsense, and the number is unbounded anyway) */
/* One implementation for both search screens. The log sheet's category step and
   the detail sheet's name step are the same question — "which one of these?" —
   so they should not drift into two components. Rows rather than chips because
   the list is open-ended: a chip cloud is scanned in two dimensions and stops
   working somewhere around a dozen items, which the activity list just passed. */
function searchRowsHTML(type, current, pickExpr, addExpr, inputId){
  const qy = searchQ.trim().toLowerCase();
  const all = labelChoices(type);
  const exact = all.some(t => t.toLowerCase() === qy);

  let h = `<div class="searchwrap"><i class="ph ph-magnifying-glass"></i>
      <input class="searchin" id="${inputId}" value="${esc(searchQ)}"
             placeholder="Search, or type your own"
             aria-label="Search" oninput="onSearch(this.value)"></div>`;
  h += '<div class="rowlist">';

  /* Your own words beat any library we could ship, and they join the list. */
  if (qy && !exact)
    h += `<button class="rowitem add" onclick="${addExpr}">
      <i class="ph ph-plus"></i>Use “${esc(searchQ.trim())}”</button>`;

  const row = t => `<button class="rowitem${t===current?' on':''}" onclick="${pickExpr(t)}">${esc(t)}</button>`;

  if (qy){
    /* Filtering already shortens the list, and bands would only fragment it. */
    const hits = all.filter(t => t.toLowerCase().includes(qy));
    h += hits.map(row).join('');
  } else {
    /* TWO BANDS. What you actually log sits at the top, ranked by how often you
       pick it — a handful of rows, no scrolling for the common case. Everything
       else follows A–Z, because a long list you are SCANNING rather than
       choosing from needs a predictable order, and alphabetical is the only
       order a stranger can guess. Relevance for the short band, alphabet for
       the long one; the same split as durations, where relevance chose the set
       and magnitude arranged it.
       Items repeat across the bands on purpose — the lower list is the complete
       one, so anything missing from it would read as missing entirely. */
    const mine = rankLabels(type).slice(0, 6);
    if (mine.length){
      h += '<div class="rowgroup">Yours</div>' + mine.map(row).join('');
      h += '<div class="rowgroup">All</div>';
    }
    h += [...all].sort((a, b) => a.localeCompare(b)).map(row).join('');
    if (!all.length) h += '<div class="rowempty">Nothing here yet.</div>';
    /* Restored after the two-band rewrite dropped it. The "Use “X”" row only
       shows once you have typed, so without this the door is invisible to
       anyone who never types — the exact gap Tutu hit twice. Sits at the end,
       after "All", so it never competes with the list itself. */
    h += `<button class="rowitem add" onclick="focusSearch()">
      <i class="ph ph-plus"></i>Add your own</button>`;
  }
  return h + '</div>';
}

function renderPickerStep(){
  const e = active.e;
  const kind = pickerStep.kind;
  const isLabel = kind === 'label';
  const field = (isLabel || kind === 'time' || kind === 'day')
    ? null : fieldsFor(e).find(f => f.key === pickerStep.key);
  const title = isLabel ? `${TYPE_NAME[e.type]} type`
              : kind === 'time' ? 'Time'
              : kind === 'day'  ? 'Day'
              : field.label;

  let h = `<div class="log-head">
      <button class="backbtn" onclick="closePicker()" aria-label="Back">
        <i class="ph ph-caret-left"></i></button>
      <h2>${esc(title)}</h2>
    </div>`;

  if (kind === 'time'){
    /* No Set button. The fields write straight to the record as you type, so
       Back is the only exit and it cannot lose anything — the same contract
       every other step here already has. A Set button on a live field is a
       button that promises a save which already happened. */
    h += `<div class="timefields">
        <input class="tf" id="tf-h" inputmode="numeric" maxlength="2" value="${e.time.slice(0,2)}"
               aria-label="Hour" oninput="onTimeField('h',this)">
        <span class="tf-sep">:</span>
        <input class="tf" id="tf-m" inputmode="numeric" maxlength="2" value="${e.time.slice(3)}"
               aria-label="Minute" oninput="onTimeField('m',this)">
      </div>`;
  } else if (kind === 'day'){
    /* Today and Yesterday cover almost everything, so they stay one tap. The
       date control sits at the same level rather than behind a "more" — it is
       the answer for anything older, not an advanced option. */
    const shortcuts = DAYS.map((d, i) => i).filter(i => DAYS[i].ago <= 1 || i === active.day);
    h += '<div class="chips">' + shortcuts.map(i =>
        `<button class="chip pick${i===active.day?' on':''}" onclick="setDay(${i})">${esc(dayName(i))}</button>`
      ).join('') + '</div>';
    h += `<div class="picker"><span class="pl">Or pick a date</span>
        <input class="date-in" type="date" value="${isoDate(dateFor(DAYS[active.day].ago))}"
               max="${isoDate(dateFor(0))}" aria-label="Pick a date"
               onchange="setDate(this.value)"></div>`;
  } else if (isLabel){
    h += searchRowsHTML(e.type, e.text,
                        t => `pickLabel(${q(t)})`, 'pickLabel(searchQ.trim())',
                        'search-detail');
  } else if (field.grams){
    const g = e.fields && e.fields[field.grams];
    const lvl = e.fields && e.fields[field.key];
    h += `<div class="numrow">
        <input class="numin" id="num-in" inputmode="numeric" maxlength="3" value="${g || ''}"
               aria-label="${esc(field.label)} in grams" oninput="onGramField('${field.key}',this)">
        <span class="numunit">grams</span>
      </div>`;
    h += '<div class="chips">' + field.gramShortcuts.map(n =>
        `<button class="chip pick${n===g?' on':''}" onclick="pickGrams('${field.key}',${n})">${n} g</button>`
      ).join('') + '</div>';
    /* The coarse answer stays reachable here — someone who opened Grams by
       mistake should not have to go back to say "High". */
    h += `<div class="picker"><span class="pl">Or just roughly</span><div class="chips">`
      + field.choices.map(c =>
          `<button class="chip pick${lvl===c?' on':''}" onclick="pickField('${field.key}',${q(c)})">${esc(c)}</button>`
        ).join('') + '</div></div>';
  } else if (field.kind === 'duration'){
    const cur = (e.fields && e.fields[field.key]) || '';
    h += `<div class="numrow">
        <input class="numin" id="num-in" inputmode="numeric" maxlength="3" value="${cur}"
               aria-label="${esc(field.label)} in minutes" oninput="onNumField('${field.key}',this)">
        <span class="numunit">minutes</span>
      </div>`;
    h += '<div class="chips">' + [...field.choices].sort((a,b)=>a-b).map(m =>
        `<button class="chip pick${m===cur?' on':''}" onclick="pickField('${field.key}',${m})">${fmtDur(m)}</button>`
      ).join('') + '</div>';
    /* No Clear button here. It did two things on one tap — emptied the value AND
       returned to the sheet — because picking a value is what closes this step.
       Clearing is not picking, so it should not navigate. The number field above
       already clears when you empty it, which is the gesture Tutu suggested:
       right next to "minutes", where the value lives. */
  }
  el('detail-body').innerHTML = h;
  /* Land on the hour with the keypad already up. Opening a step to type and
     then having to tap the field is the step charging for itself. */
  if (kind === 'time'){ const hh = el('tf-h'); if (hh){ hh.focus(); hh.select(); } }
}
/* The same box appears on two surfaces. Both stay in the DOM once rendered, so
   they need DISTINCT ids — sharing one is invalid HTML and el() would silently
   return whichever came first, which is not always the open one.
   Focus and caret are restored by hand because a keystroke destroys the input;
   a full re-render is cheap at this size and keeps a single code path. */
function focusSearch(){
  const si = el(pickerStep ? 'search-detail' : 'search-log');
  if (si) si.focus();
}
function onSearch(v){
  searchQ = v;
  if (pickerStep) renderDetail(); else renderLogSheet();
  const si = el(pickerStep ? 'search-detail' : 'search-log');
  if (si){ si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
}
/* Live like the other numeric fields; never re-renders mid-keystroke. */
/* Grams supersede the level, and an empty box means neither. */
function onGramField(key, node){
  const digits = node.value.replace(/\D/g,'').slice(0,3);
  if (digits !== node.value) node.value = digits;
  const e = active.e, f = (CONTEXT[e.type]||[]).find(x => x.key === key);
  e.fields = e.fields || {}; ownIt(f.grams);
  delete e.fields[key];
  if (digits === '') delete e.fields[f.grams]; else e.fields[f.grams] = parseInt(digits,10);
  renderTimeline();
}
function pickGrams(key, n){
  const e = active.e, f = (CONTEXT[e.type]||[]).find(x => x.key === key);
  e.fields = e.fields || {}; ownIt(f.grams);
  delete e.fields[key]; e.fields[f.grams] = n;
  pickerStep = null; openField = null;
  renderDetail(); renderTimeline();
}
function onNumField(key, node){
  const digits = node.value.replace(/\D/g,'').slice(0,3);
  if (digits !== node.value) node.value = digits;
  const e = active.e; e.fields = e.fields || {}; ownIt(key);
  if (digits === '') delete e.fields[key]; else e.fields[key] = parseInt(digits,10);
  sortDay(DAYS[active.day]); renderTimeline();
}
function openPicker(kind, key){ pickerStep = { kind, key }; openMini = null; searchQ = ''; renderDetail(); }
/* Coming back from a field's own step means that field has been answered, so
   its inline picker collapses too. Leaving it open showed the value and the
   chooser for it at the same time. */
function closePicker(){ pickerStep = null; searchQ = ''; openField = null; renderDetail(); }
function pickField(key, val){
  const e = active.e; e.fields = e.fields || {}; ownIt(key);
  const f = fieldsFor(e).find(x => x.key === key);
  if (f && f.grams) delete e.fields[f.grams];   /* a level supersedes grams */
  if (val === null) delete e.fields[key]; else e.fields[key] = val;
  pickerStep = null; openField = null;
  sortDay(DAYS[active.day]);        /* duration moves the derived start */
  renderDetail(); renderTimeline();
}
function toggleMini(k){ openMini = (openMini === k) ? null : k; renderDetail(); }
/* Switching anchor keeps the clock time and re-reads what it means, which is
   what "I meant that was the start" expects. Re-sorts: the derived start moves. */
function setAnchor(v){ active.e.anchor = v; openMini = null;
                       sortDay(DAYS[active.day]); renderDetail(); renderTimeline(); }

/* The entry name is always open-ended, so it always gets the search step. */
function startLabelEdit(){ openPicker('label'); }
function endLabelEdit(){ editingLabel = false; renderDetail(); }
/* Live, like the time fields — writes through to the rail without re-rendering
   the sheet, which would take the caret with it. */
function setLabel(v){ active.e.text = v; renderTimeline(); }
function pickLabel(t){ active.e.text = t; editingLabel = false; pickerStep = null; searchQ = '';
                       renderDetail(); renderTimeline(); }

/* Writes live so the rail behind the sheet stays truthful, but never calls
   renderDetail: re-rendering mid-keystroke would destroy the field and take the
   caret with it. This is also why the step needs no Set button. */
function onTimeField(which, node){
  const digits = node.value.replace(/\D/g,'').slice(0,2);
  if (digits !== node.value) node.value = digits;
  const cap = which === 'h' ? 23 : 59;
  let n = digits === '' ? 0 : Math.min(cap, parseInt(digits,10));
  const [hh,mm] = active.e.time.split(':');
  active.e.time = which === 'h' ? String(n).padStart(2,'0') + ':' + mm
                                : hh + ':' + String(n).padStart(2,'0');
  sortDay(DAYS[active.day]);
  renderTimeline();
  if (which === 'h' && digits.length === 2){ const m = el('tf-m'); if (m){ m.focus(); m.select(); } }
}
function setNow(){
  if (active.day !== 0) setDay(0);
  active.e.time = nowTime();
  sortDay(DAYS[0]);
  renderDetail(); renderTimeline();
}
/* Moving days moves the entry between lists — the day IS the list it lives in. */
function setDay(target){
  openMini = null;
  const e = active.e;
  if (target !== active.day){
    DAYS[active.day].list = DAYS[active.day].list.filter(x => x !== e);
    DAYS[target].list.push(e);
    sortDay(DAYS[target]);
    active.day = target;
  }
  /* Picking the day you are already on is not a mistake to punish — it is how
     someone confirms. Close the step either way. */
  pickerStep = null;
  pruneDays();
  renderDetail(); renderTimeline();
}

/* A day older than yesterday has no bucket until someone puts something in it.
   Created on demand, removed again when it empties, so the rail never shows a
   date with nothing under it. */
function setDate(iso){
  if (!iso) return;
  const [y, m, d] = iso.split('-').map(Number);
  const ago = Math.round((dateFor(0) - new Date(y, m - 1, d)) / 86400000);
  if (ago < 0) return;                 /* you cannot have logged the future */
  let i = DAYS.findIndex(x => x.ago === ago);
  if (i < 0){
    DAYS.push({ ago, live:false, list:[] });
    DAYS.sort((a, b) => a.ago - b.ago);
    active.day = DAYS.findIndex(x => x.list.includes(active.e));
    i = DAYS.findIndex(x => x.ago === ago);
  }
  setDay(i);
}
/* Indices shift when a day is added or dropped, and active.day is an index, so
   it gets re-derived from the entry itself rather than adjusted by hand. */
function pruneDays(){
  DAYS = DAYS.filter(d => d.ago <= 1 || d.list.length);
  if (active) active.day = DAYS.findIndex(x => x.list.includes(active.e));
}

/* ═════════ detail actions — every one writes straight to the record ═════════ */
function openDetail(e, day){
  active = { e, day };
  basisOpen = (e.type === 'dose' && e.basis === 'assumed');  /* lead with what's unresolved */
  openField = null; editingLabel = false;
  pickerStep = null; openMini = null;
  renderDetail();
  openSheet('sheet-detail');
}
function tapEntry(di, i){ openDetail(DAYS[di].list[i], di); }
function toggleBasis(){ basisOpen = !basisOpen; renderDetail(); }
function setBasis(k){
  active.e.basis = k;
  basisOpen = false;
  renderDetail(); renderTimeline();
}
function nudge(mins){
  if (!canNudge(mins)) return;                    /* the button is disabled; belt and braces */
  const e = active.e;
  let m = toMin(e.time) + mins;
  m = Math.max(0, Math.min(23*60 + 59, m));       /* stay inside the day — no silent rollover */
  e.time = String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  /* occurred_at only. e.recorded is untouched — the user is correcting when the
     dose happened, not rewriting when they told us about it. */
  sortDay(DAYS[active.day]);                      /* order is a property of the day, not the DOM */
  renderDetail(); renderTimeline();
}
function toggleField(key){
  const f = fieldsFor(active.e).find(x => x.key === key);
  if (f && f.kind === 'duration'){ openPicker('field', key); return; }
  openField = (openField === key) ? null : key; renderDetail();   /* short closed list */
}
/* MULTI fields hold an array and toggle; the picker deliberately stays open,
   because "what eased" is usually more than one thing and closing after each
   tap would make the second answer cost as much as the first. Single fields
   keep replacing and closing, which is right when there is only one answer. */
function toggleMulti(key, val){
  const e = active.e; e.fields = e.fields || {}; ownIt(key);
  const cur = Array.isArray(e.fields[key]) ? e.fields[key].slice() : [];
  const i = cur.indexOf(val);
  if (i > -1) cur.splice(i, 1); else cur.push(val);
  if (cur.length) e.fields[key] = cur; else delete e.fields[key];
  renderDetail(); renderTimeline();        /* openField untouched — stay open */
}
function setField(key, val){
  const e = active.e;
  e.fields = e.fields || {}; ownIt(key);
  /* Same guard as pickField — the inline picker and the step both write here,
     and grams/level must never coexist. Missing it left "26 g" AND "Some" on
     the same meal, which is two answers to one question. */
  const f = fieldsFor(e).find(x => x.key === key);
  if (f && f.grams) delete e.fields[f.grams];
  if (val === null) delete e.fields[key]; else e.fields[key] = val;
  openField = null;
  renderDetail(); renderTimeline();
}
/* Height follows content: reset, then take the scroll height. Runs on input and
   once after every render, so an existing note opens at its real size. */
function autoGrow(n){ n.style.height = 'auto'; n.style.height = n.scrollHeight + 'px'; }
function setNote(v){
  const e = active.e;
  if (v) e.note = v; else delete e.note;   /* empty means no note, not an empty one */
  /* the moment they type into a read, it stops being a read. Class removed on
     the live node rather than by re-rendering, for the same caret reason. */
  if (e.guess && e.guess.note){
    delete e.guess.note;
    const n = el('note-in'); if (n) n.classList.remove('guess');
  }
  renderTimeline();                        /* no re-render: don't steal the caret */
}
/* The entry is not spliced out — it is flagged and kept in place, so the rail
   doesn't jump and the marker can name what went. One tombstone at a time:
   removing something else commits the previous removal. */
function removeActive(){
  const e = active.e;
  purgeTombs();
  e.removed = true;
  closeSheets();
  renderTimeline();
}
function purgeTombs(){ DAYS.forEach(d => { d.list = d.list.filter(x => !x.removed); }); }
function undoRemove(di, i){ delete DAYS[di].list[i].removed; renderTimeline(); }

/* ═════════ card actions — D-01 no reason ask · D-02 no stack, quiet collapse ═════════
   TIMESTAMPS. Two stamps, never one [docs/entry-schema.md]:
     time      = occurred_at, when the thing happened. Drives sort order.
     recorded  = recorded_at, when the user told us. Never drives sort order.
   The card proposes "Levodopa, 10:30" and Yes CONFIRMS THAT PROPOSAL — so the
   dose lands at 10:30, not at the moment of tapping. Stamping it "now" made Yes
   and "Yes, but not as scheduled" produce identical records, which left the
   second button with nothing to do. Nudging the time in the detail sheet moves
   occurred_at only; recorded_at is a fact about the past and never changes. */
function cardYes(){
  addEntry({ time:currentDose.sched, recorded:nowTime(),
             text:currentDose.name, type:'dose', basis:'asserted' }, 0);
  currentDose = null; renderCard();
}
function cardNo(){
  /* "No" is a REPORTED skip → basis:'declined'. Clinically valuable, and distinct
     from 'assumed' (we asked and got nothing back). */
  addEntry({ time:currentDose.sched, recorded:nowTime(),
             text:currentDose.name, type:'dose', basis:'declined' }, 0);
  currentDose = null; renderCard();
}
/* "Not exactly" = yes, with corrections. The entry lands as asserted at the
   SCHEDULED time (not now) — that is the fact being corrected — and the sheet
   opens on it. Two taps have already produced a complete, valid record; the
   sheet is where depth becomes available, never where it becomes required. */
function cardAdjust(){
  const e = { time:currentDose.sched, recorded:nowTime(),
              text:currentDose.name, type:'dose', basis:'asserted' };
  addEntry(e, 0);
  currentDose = null; renderCard();
  openDetail(e, 0);
}

/* a new dose falling due quietly collapses the unanswered one into the timeline as 'assumed' */
function demoAddDose(){
  if (currentDose){
    DAYS[0].list.push({ time:currentDose.sched, recorded:nowTime(),
                        text:currentDose.name, type:'dose', basis:'assumed' });
    sortDay(DAYS[0]);
    renderTimeline();
  }
  const t = ['14:00','17:30','21:00'];
  currentDose = { name:'Levodopa 100mg', sched:t[Math.floor(Math.random()*3)] };
  renderCard();
}
function demoEmpty(){ DAYS.forEach(d => d.list = []); currentDose = null;
                      renderCard(); renderTimeline(); }

/* ═════════ logging ═════════
   No confirmation message. The entry appearing on the rail at the right time
   IS the confirmation — a toast saying "Walk — added" next to a visible Walk
   entry is the same fact twice, and the weaker copy of it. What the app owes
   the user instead is certainty about WHICH entry is new, and a guarantee it
   is actually on screen. Hence the highlight plus the scroll. */
function addEntry(e, di){
  DAYS[di].list.unshift(e);
  sortDay(DAYS[di]);
  freshEntry = e;
  renderTimeline();
  freshEntry = null;          /* only the render right after the add marks it */
  /* Scroll to the ENTRY, not to the top. Now that order follows occurred_at, a
     confirmed 10:30 dose logged at 17:19 lands partway down the rail — scrolling
     to the top would show the user everywhere except the thing they just did. */
  requestAnimationFrame(() => {
    const n = document.querySelector('.entry.fresh');
    if (!n) return;
    n.scrollIntoView({ block:'center',
                       behavior: REDUCED_MOTION.matches ? 'auto' : 'smooth' });
    /* Remove the class on the live node rather than re-rendering, so the wash
       fades out via .ecard's transition instead of being replaced mid-fade. */
    setTimeout(() => n.classList.remove('fresh'), 1800);
  });
}
function quickLog(btn, text, type){
  addEntry({ time:nowTime(), recorded:nowTime(), text, type, basis:'asserted' }, 0);
  btn.classList.add('flash');     /* confirmation at the source, where the eye is */
  setTimeout(()=> btn.classList.remove('flash'), 600);
  setTimeout(closeSheets, 260);
}

/* ═════════ sheets ═════════ */
const SHEETS = ['sheet-log','sheet-detail'];
/* `inert` on the sheets that are not open. A closed sheet is only translated
   off-screen, so without this its buttons stay tabbable and its text stays in
   the accessibility tree — a keyboard or screen-reader user can land inside a
   panel nobody can see. One attribute does focus, pointer events and AT
   visibility in one go. */
function setSheetInert(openId){
  SHEETS.forEach(sid => { const n = el(sid);
    if (sid === openId) n.removeAttribute('inert'); else n.setAttribute('inert',''); });
}
function openSheet(id){
  if (id === 'sheet-log'){ logStep = null; searchQ = ''; renderLogSheet(); }
  lastFocus = document.activeElement;
  el('scrim').classList.add('open');
  SHEETS.forEach(s => el(s).classList.toggle('open', s === id));
  setSheetInert(id);
  el(id).focus();                                   /* screen readers land inside the sheet */
}
function closeSheets(){
  el('scrim').classList.remove('open');
  SHEETS.forEach(s => el(s).classList.remove('open'));
  setSheetInert(null);
  active = null; openField = null; editingLabel = false; pickerStep = null; openMini = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

/* ── temporary tuning controls — remove before this becomes real ── */
function toggleTuner(){ el('tuner').classList.toggle('open'); }
function setScale(v){
  if (v) document.documentElement.dataset.textScale = v;
  else delete document.documentElement.dataset.textScale;
}
function setVar(name, value){ document.documentElement.style.setProperty(name, value); }

/* iOS does not shrink the layout viewport when the keyboard opens, so anything
   pinned to bottom:0 ends up behind it — and the time step is nothing but a
   field you are meant to type into. visualViewport reports what is actually
   visible, so the sheet sits on top of the keyboard instead of under it.
   `interactive-widget=resizes-content` covers Chrome and Android, where the
   layout viewport does shrink and this measures zero. Both paths, one rule. */
const vv = window.visualViewport;
if (vv){
  const trackKeyboard = () => {
    const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', Math.round(hidden) + 'px');
  };
  vv.addEventListener('resize', trackKeyboard);
  vv.addEventListener('scroll', trackKeyboard);
  trackKeyboard();
}

renderCard(); renderTimeline(); renderLogSheet(); setSheetInert(null);
</script>
