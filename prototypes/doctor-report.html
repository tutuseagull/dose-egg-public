<title>DoseEgg · Report for your visit</title>
<!-- REPORT FOR YOUR VISIT, 2026-11-09. The third demo moment for the pitch: a
     record becomes one page to bring to an appointment.
     What it is (decided with the domain lead, Oct 2026): the patient's own notes for the
     visit. Data and questions, never advice. The patient is the author; the
     doctor is the reader. Footer: "Recorded by the patient. Not a medical
     assessment."
     Rules this page follows:
       · TEMPLATED, NEVER GENERATED [AGENTS.md, AI features]. Every sentence is a
         fixed template from the statement bank, filled with numbers COMPUTED from
         the sample record below. Nothing is written by a model.
       · Only ALLOWED statements (analyze-statements.html). Nothing from the Held
         category: no progression, no "the medicine is working", no app-suggested
         questions (H-04). The questions are the patient's own.
       · Every pattern carries its coverage ("4 of 5 days"). A day with no entry is
         unknown, never zero, and is drawn as such.
       · Amounts are OFF by default. Some people take less than prescribed, by
         choice; including amounts is theirs to decide at export (P02, 2026-11-03).
       · No red/green, no good/bad, no scores. One mark colour.
     Two scenarios (Tutu, 2026-11-03): a REGULAR doctor (what happened in the last
     two weeks) and a NEW doctor (the long view: plan history, by 3 months).
     English and Japanese: same page, a switch. Japanese wording is a first pass,
     to be checked by a native speaker before it goes on stage.
     Sample data, generated and shaped like the domain lead's pattern. Never real
     data in this file. -->

<script>
function paintEdges(){
  const c = getComputedStyle(document.documentElement).getPropertyValue('--surface-page').trim();
  document.documentElement.style.setProperty('--edge', c);
  const m = document.getElementById('themeColor'); if (m && c) m.setAttribute('content', c);
}
addEventListener('DOMContentLoaded', () => {
  const s = document.createElement('div'); s.className = 'edge-top'; s.setAttribute('aria-hidden', 'true');
  document.body.appendChild(s); paintEdges();
});

<style>
/* Shared tokens come from ../tokens.css. Only this screen's layout tokens here. */
:root{
  --gutter:16px;
  --shell-w:420px;
  --paper-pad:20px;       /* the report page's inner margin */
  --row-h:22px;           /* one day in the timing chart */
}

/* ═══════════════════ base (same as Look Back) ═══════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%}
body{margin:0;background:var(--backdrop);font-family:var(--font-sans);
     font-size:var(--text-body);line-height:var(--leading-body);color:var(--text-primary);
     -webkit-font-smoothing:antialiased;display:flex;justify-content:center}
@media (max-width: 480px){
  html{background:var(--edge, var(--surface-page))}
  body{background:var(--surface-page)}
  .edge-top{position:fixed;top:0;left:0;right:0;height:1px;background:var(--edge, var(--surface-page));
            z-index:1;pointer-events:none}
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);
               outline-offset:var(--focus-ring-offset);border-radius:var(--radius-sm)}
[hidden]{display:none!important}
.shell{width:100%;max-width:var(--shell-w);background:var(--surface-page);min-height:100vh;
       position:relative;display:flex;flex-direction:column}

.demo-bar{display:flex;gap:var(--space-2);padding:var(--space-2) var(--space-3);
          background:var(--paper-800);align-items:center;flex-wrap:wrap}
.demo-bar .db{font-size:var(--text-label);letter-spacing:.04em;text-transform:uppercase;
              color:var(--paper-400);font-weight:500;padding-right:var(--space-1)}
.demo-btn{font-size:var(--text-label);font-weight:500;color:var(--paper-100);
          background:color-mix(in srgb, var(--paper-0) 12%, transparent);
          padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);
          display:flex;align-items:center;min-height:var(--space-8);text-decoration:none}
.demo-btn.home{font-weight:600}

/* ── top bar: a step under Look Back, so Back on the left, title beside it ── */
.top{display:flex;align-items:center;gap:var(--space-2);
     padding:var(--space-4) var(--space-4) var(--space-2);
     position:sticky;top:0;z-index:30}
.top::before{content:'';position:absolute;inset:0 0 calc(var(--space-4) * -1) 0;z-index:-1;
             background:linear-gradient(to bottom,
               color-mix(in srgb, var(--surface-page) 88%, transparent) 0%,
               color-mix(in srgb, var(--surface-page) 60%, transparent) 60%, transparent 100%);
             pointer-events:none}
.icon-btn{width:var(--target-min);height:var(--target-min);display:flex;align-items:center;
          justify-content:center;border-radius:var(--radius-full);flex:0 0 auto;
          background:var(--glass-fill);box-shadow:var(--glass-rim), var(--glass-shadow);
          -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
          color:var(--text-primary);text-decoration:none}
.icon-btn i{font-size:22px}
.top h1{font-size:var(--text-heading);font-weight:600;margin:0;line-height:var(--leading-tight)}

.scroll{flex:1;padding:var(--space-2) var(--gutter) var(--space-12);
        display:flex;flex-direction:column;gap:var(--space-4)}
.lede{margin:0;color:var(--text-secondary)}

/* ── the settings line, and the Adjust sheet ── */
.setline{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;
         padding:var(--space-1) 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.setline span{flex:1;min-width:0;color:var(--text-secondary)}
.textbtn{min-height:var(--target-min);padding:0 var(--space-3);margin-right:calc(var(--space-3) * -1);
  border-radius:var(--radius-md);color:var(--accent);font-weight:600;
  display:flex;align-items:center;gap:var(--space-2);flex:0 0 auto}
.textbtn i{font-size:20px}
.textbtn:active{background:var(--surface-raised)}
.scrim{position:fixed;inset:0;background:var(--backdrop-dim, rgba(26,25,22,.34));opacity:0;pointer-events:none;
       transition:opacity var(--motion-base) var(--ease-out);z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);width:100%;max-width:var(--shell-w);
       background:var(--surface-card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:60;
       padding:var(--space-2) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom));
       box-shadow:var(--shadow-overlay);transition:transform var(--motion-slow) var(--ease-settle)}
.sheet.open{transform:translate(-50%,0)}
html .scrim:not(.open){visibility:hidden;transition:opacity var(--motion-base) var(--ease-out), visibility 0s linear var(--motion-base)}
html .sheet:not(.open){visibility:hidden;transition:transform var(--motion-slow) var(--ease-settle), visibility 0s linear var(--motion-slow)}
html .sheet.open{visibility:visible}
.pull{width:40px;height:var(--space-1);border-radius:var(--radius-full);background:var(--paper-300);margin:0 auto var(--space-4)}
.sh-body{display:flex;flex-direction:column;gap:var(--space-6)}
.sh-head{display:flex;align-items:center;gap:var(--space-2)}
.sh-head h2{flex:1;margin:0;font-size:var(--text-title);font-weight:600;line-height:var(--leading-tight)}
.icon-btn.plain{background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;
                color:var(--text-secondary);margin-right:calc(var(--space-3) * -1)}
.fieldset{display:flex;flex-direction:column;gap:var(--space-2)}
.lab{font-weight:600}
/* two languages: each its own paper, its own printed page */
.papers-lang{margin:var(--space-4) 0 var(--space-2);font-size:var(--text-label);font-weight:600;
             color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}
#papers{display:flex;flex-direction:column}
.seg{display:flex;gap:var(--space-1);background:var(--surface-sunken);
     border-radius:var(--radius-md);padding:var(--space-1)}
.seg button{flex:1;min-height:var(--target-routine);border-radius:var(--radius-sm);
     font-size:var(--text-body);font-weight:500;color:var(--text-secondary);padding:0 var(--space-2)}
.seg button[aria-pressed="true"]{background:var(--surface-card);color:var(--text-primary);
     font-weight:600;box-shadow:var(--content-edge)}
.optrow{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.optrow .lang{flex:0 0 auto}
.optrow .lang button{min-width:var(--target-critical);white-space:nowrap;padding:0 var(--space-3)}
.switchrow{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:var(--space-3);
           min-height:var(--target-min);text-align:right}
.switch{position:relative;width:52px;height:32px;border-radius:var(--radius-full);flex:0 0 auto;
        background:var(--paper-300);transition:background var(--motion-fast) var(--ease-out)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;
        border-radius:var(--radius-full);background:var(--surface-card);box-shadow:var(--content-edge);
        transition:transform var(--motion-fast) var(--ease-out)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
/* the switch is 32px tall; its row is the 48px target */
.switchrow label{cursor:pointer}
.hint{margin:0;font-size:var(--text-label);color:var(--text-muted);line-height:var(--leading-body)}
/* language picker: native selects, so a long list opens the phone's own picker */
.langrow{display:flex;align-items:center;gap:var(--space-2)}
.langrow[hidden]{display:none}
.selwrap{position:relative;flex:1;display:flex}
.selwrap select{flex:1;-webkit-appearance:none;appearance:none;min-height:var(--target-routine);
  padding:0 calc(var(--space-4) + 22px) 0 var(--space-4);border:1px solid var(--border-control);
  border-radius:var(--radius-md);background:var(--surface-card);color:var(--text-primary);
  font:inherit;font-size:var(--text-body)}
.selwrap i{position:absolute;right:var(--space-4);top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--text-muted);pointer-events:none}
.textbtn.left{margin-right:0;margin-left:calc(var(--space-3) * -1);align-self:flex-start}
.textbtn[hidden]{display:none}

/* ═══════════════════ the page itself ═══════════════════
   A document a doctor reads, so it looks like paper: white, flat, a hairline, no
   app chrome inside it. It reads the same on a phone, on a laptop shown across the
   desk, and printed. */
.paper{display:flex;flex-direction:column}
/* SECTIONS AS CARDS (Tutu, 2026-11-09). On screen each section is a card, so a
   ten-minute reader can find one block at a glance; the summary card (who, when,
   the plan, at a glance) is tinted so it reads as the part to look at first.
   Inside a card the rhythm is set once: --space-3 between lines, --space-4 under
   the heading. Printed, the cards become flat sections with a hairline. */
/* NO CARDS (Tutu, 2026-11-09). In this app a white card with a border means
   "tap this" (timeline rows, the Cabinet). Nothing in the report is tappable, so
   sections sit flat on the page, separated by space and their headings. The one
   fill left is the questions block. */
.card{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-6) 0;
      border-top:1px solid var(--border-subtle)}
.card:first-child, .details-h + .card{border-top:0;padding-top:var(--space-2)}
.card.memo{gap:var(--space-6)}
.mblk{display:flex;flex-direction:column;gap:var(--space-2)}
.mblk h3, .ask h3{margin:0;font-size:var(--text-label);font-weight:700;color:var(--accent);letter-spacing:.02em}
/* the questions are the one tinted block: the visit is for the conversation */
.ask{background:var(--surface-accent);border-radius:var(--radius-md);padding:var(--space-4);
     display:flex;flex-direction:column;gap:var(--space-2)}
.ask .qs textarea{background:transparent}
.details-h{margin:var(--space-6) 0 0;padding-top:var(--space-6);border-top:2px solid var(--border-control);
           font-size:var(--text-label);font-weight:600;
           color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}
.paper[lang="ja"]{font-family:var(--font-sans), 'Noto Sans JP', sans-serif}
.paper[lang="zh"]{font-family:var(--font-sans), 'Noto Sans SC', 'PingFang SC', sans-serif}
.p-head{display:flex;flex-direction:column;gap:var(--space-2)}
.p-kicker{font-size:var(--text-label);font-weight:600;color:var(--text-muted);letter-spacing:.02em}
.p-title{font-size:var(--text-heading);font-weight:700;line-height:var(--leading-tight);margin:0}
.p-meta{font-size:var(--text-body);color:var(--text-secondary)}
.p-meta b{color:var(--text-primary);font-weight:600}
.blk{display:flex;flex-direction:column;gap:var(--space-3)}
.card.blk{gap:var(--space-3)}
.summary .blk{padding-top:var(--space-4);border-top:1px solid color-mix(in srgb, var(--mark) 18%, transparent)}
.blk h3{margin:0;font-size:var(--text-body);font-weight:700;line-height:var(--leading-tight)}
.blk h3 .n{color:var(--text-muted);font-weight:600;margin-right:var(--space-2)}

/* at a glance: each observation with its evidence, the count leading */
.obs{display:flex;gap:var(--space-3);align-items:flex-start}
.obs .cnt{flex:0 0 auto;min-width:3.4rem;font-weight:700;font-size:var(--text-body);
          font-variant-numeric:tabular-nums;color:var(--mark);line-height:var(--leading-body)}
.obs p{margin:0}

/* the timing chart: one row per day */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);font-size:var(--text-label);
        color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2)}
.k{width:12px;height:12px;flex:0 0 auto;display:inline-block}
.k.dose{border-radius:var(--radius-full);background:var(--mark)}
.k.plan{width:2px;height:14px;background:var(--viz-grid);border-radius:var(--radius-sm)}
.k.off{border-radius:var(--radius-full);border:2px solid var(--viz-ink);background:var(--surface-card)}
.k.on{transform:rotate(45deg);border:2px solid var(--viz-ink);background:var(--surface-card);width:10px;height:10px}
.k.none{border:1.5px dashed var(--viz-missing);border-radius:var(--radius-sm);width:16px}

/* fixed-order fact rows: label, count, the denominator in words */
.facts{display:flex;flex-direction:column}
.fact{display:flex;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;
      border-bottom:1px solid var(--border-subtle)}
.fact:last-child{border-bottom:0}
.fact .fl{flex:1;min-width:0}
.fact .fv{flex:0 0 auto;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.note-small{margin:0;font-size:var(--text-label);color:var(--text-muted)}

/* notable days */
.days{display:flex;flex-direction:column;gap:var(--space-2);margin:0;padding:0;list-style:none}
.days li{display:flex;gap:var(--space-3)}
.days .d{flex:0 0 auto;min-width:6.5rem;font-weight:600;font-variant-numeric:tabular-nums}

/* by 3 months, and plan history */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:var(--text-label);font-weight:600;color:var(--text-muted);
        padding:0 var(--space-2) var(--space-2) 0;vertical-align:bottom}
.tbl td{padding:var(--space-2) var(--space-2) var(--space-2) 0;border-top:1px solid var(--border-subtle);
        vertical-align:top}
.tbl td.r, .tbl th.r{text-align:right;padding-right:0;padding-left:var(--space-3)}
.tbl td.r{white-space:nowrap}

/* my questions: written by the person, edited here, printed as a numbered list */
.qs{display:flex;flex-direction:column;gap:var(--space-2);margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{display:flex;gap:var(--space-3);align-items:flex-start;counter-increment:q}
.qs .qprint{display:none}
.qs li::before{content:counter(q) ".";flex:0 0 auto;font-weight:700;min-width:1.4rem;
               line-height:var(--target-min)}
.qs textarea{flex:1;min-width:0;min-height:var(--target-min);resize:none;border:1px solid transparent;
             border-radius:var(--radius-sm);padding:var(--space-2) var(--space-2);background:transparent;
             line-height:var(--leading-body);field-sizing:content}
.qs textarea:hover{border-color:var(--border-subtle)}
.qs textarea:focus{border-color:var(--border-interactive);outline:none;background:var(--surface-page)}
.addq{align-self:flex-start;min-height:var(--target-min);padding:0 var(--space-3);
      margin-left:calc(var(--space-3) * -1);border-radius:var(--radius-md);color:var(--accent);
      display:flex;align-items:center;gap:var(--space-2);font-weight:500}
.addq i{font-size:18px}
.p-foot{padding:var(--space-2) var(--space-1) 0;
        font-size:var(--text-label);color:var(--text-muted);display:flex;flex-direction:column;gap:var(--space-1)}

/* ── the new-doctor long view ── */
.ctxcard{background:var(--surface-accent);border-radius:var(--radius-md);padding:var(--space-4);
         display:flex;flex-direction:column;gap:var(--space-4)}
.ctxcard[hidden]{display:none}
.ctx-q{margin:0;font-size:var(--text-heading);font-weight:600;line-height:var(--leading-tight)}
.ctx-acts{display:flex;gap:var(--target-gap)}
.c-btn{flex:1 1 6rem;min-height:var(--target-routine);border-radius:var(--radius-md);font-weight:600;
       border:1px solid var(--border-subtle);background:var(--surface-card)}
.c-btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field{width:100%;min-height:var(--target-min);border:1px solid var(--border-control);border-radius:var(--radius-sm);
       padding:var(--space-2) var(--space-3);background:var(--surface-card);line-height:var(--leading-body);resize:none}
.field:focus{outline:none;border-color:var(--border-interactive)}
.lead-intro{margin:0}
.fact .fl small{display:block;font-size:var(--text-label);color:var(--text-muted)}
.lanes{width:100%;height:auto;display:block}
.tbl.pace{table-layout:fixed}
.tbl.pace th:first-child{width:34%}
.tbl.pace th.r{white-space:normal;line-height:var(--leading-tight)}
.tbl.pace td.r{white-space:normal}
.tbl.pace th small{display:block;font-weight:400}
.tbl.pace td.few{color:var(--text-muted);white-space:normal}
.days .dt{flex:1;min-width:0}
.days .hide-day{flex:0 0 auto;margin:calc(var(--space-3) * -1) calc(var(--space-3) * -1) 0 0;color:var(--text-muted)}
.about{margin:0}
.ask .addq.ask-this, .mblk .ask-this{margin-top:var(--space-1)}

/* ── the one action: save it as a file to hand over ── */
.act{display:flex;flex-direction:column;gap:var(--space-2);align-items:stretch}
.btn{min-height:var(--target-routine);border-radius:var(--radius-full);font-weight:600;
     display:flex;align-items:center;justify-content:center;gap:var(--space-2);
     background:var(--accent);color:var(--on-accent)}
.btn i{font-size:20px}
.done{display:flex;align-items:center;gap:var(--space-2);justify-content:center;
      color:var(--text-secondary);font-size:var(--text-body);min-height:var(--target-min)}
.done i{color:var(--accent);font-size:20px}

/* PRINT: only the paper, on a white page. This is what "Save as PDF" makes. */
@media print{
  @page{margin:12mm}
  html,body{background:#fff}
  .demo-bar,.top,.setline,.lede,.act,.addq,.edge-top,.scrim,.sheet,.papers-lang,.ctxcard,.hide-day{display:none!important}
  .ask.empty{display:none!important}
  /* the long view is two pages: the memo, then the details */
  .paper.long .details-h{display:block;break-before:page;border-top:0;padding-top:0;margin-top:0}
  .paper.long .lanes{max-width:100mm}   /* the SVG scales its 14-unit text with it: about 100mm keeps it near body size */
  .paper + .papers-lang + .paper, .paper.next{break-before:page}
  .shell{max-width:none;background:#fff}
  .scroll{padding:0}
  .paper{gap:0}
  /* paper is read at arm's length by the doctor, not on a phone mid-episode: body
     prints at 14px (the floor), tighter rhythm, so one language fits one page */
  html{font-size:82.4%}
  .card{border:0;border-top:1px solid #ccc;border-radius:0;padding:2mm 0;background:#fff;gap:1.5mm}
  .p-foot{padding-top:1mm}
  .details-h{display:none}
  .card.blk, .blk{gap:2mm}
  .p-head{gap:1mm}
  .obs, .fact, .days li{break-inside:avoid}
  .fact{padding:1mm 0}
  .card.memo{border-top:0;padding-top:0;gap:2.5mm}
  .mblk{gap:1mm}
  .legend{gap:1mm 3mm}
  .ask{background:#fff;border:1px solid #bbb;margin:0;padding:3mm}
  .details-h{margin:2mm 0 0}
  .qs textarea{display:none}
  .qs .qprint{display:inline}
  .qs li::before{line-height:var(--leading-body)}
  .qs{gap:1mm}
  /* the chart scales with its box: on paper it would fill the width and push the
     page to three, so it keeps about the size it has on a phone */
  .chart{max-width:62mm}
  /* on paper the chart and "Alongside" sit side by side, so one language is one page */
  .paper{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm}
  .paper > *{grid-column:1 / -1}
  .paper > .half{grid-column:auto}
  .k{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .qs li:has(textarea:placeholder-shown), .qs li:has(textarea:empty){display:none}
}
</style>
</head>
<body>
<div class="shell">

  <div class="demo-bar">
    <a class="demo-btn home" href="../index.html">← Home</a>
    <span class="db">Report · sample data</span>
  </div>

  <div class="top">
    <a class="icon-btn" href="look-back-gaps.html" onclick="if (document.referrer && history.length > 1){ history.back(); return false; }" aria-label="Back"><i class="ph ph-arrow-left"></i></a>
    <h1 id="t-screen">Report for your visit</h1>
  </div>

  <main class="scroll">

    <!-- SETTINGS (2026-11-09): sensible defaults need no setup, so the page opens
         straight on the report. One line says what you are looking at; Adjust
         changes it. Changes apply as you tap (no Set button), like every step. -->
    <div class="setline">
      <span id="setsum"></span>
      <button class="textbtn" onclick="openAdjust()"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i>Adjust</button>
    </div>
    <!-- CONTEXT FOR A NEW DOCTOR (Tutu, 2026-11-20). A new doctor's first questions
         (year diagnosed, other conditions) are not in the record, so the report
         offers once, in the same shape as the dose card: answer first, Add or Skip.
         What is typed stays on the phone and is printed as written, never translated. -->
    <div class="ctxcard" id="ctxcard" hidden>
      <p class="ctx-q">Add some context for a new doctor?</p>
      <div class="ctx-acts">
        <button class="c-btn primary" onclick="openCtx()">Add</button>
        <button class="c-btn" onclick="skipCtx()">Skip</button>
      </div>
    </div>
    <div id="papers" data-clock-skip></div>

    <div class="act">
      <button class="btn" onclick="savePdf()"><i class="ph ph-export"></i><span id="t-save"></span></button>
      <p class="hint" id="t-savehint" style="text-align:center"></p>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" onclick="closeAdjust()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="pull"></div>
  <div class="sh-body">
    <div class="sh-head">
      <h2 id="sh-title">Report settings</h2>
      <button class="icon-btn plain" onclick="closeAdjust()" aria-label="Close"><i class="ph ph-x"></i></button>
    </div>
    <div class="fieldset">
      <span class="lab">Who it is for</span>
      <div class="seg" role="group" aria-label="Who it is for">
        <button id="sc-reg" aria-pressed="true" onclick="setScene('reg')">Regular doctor</button>
        <button id="sc-new" aria-pressed="false" onclick="setScene('new')">New doctor</button>
      </div>
      <p class="hint" id="scHint"></p>
    </div>
    <div class="fieldset">
      <!-- LANGUAGE (2026-11-20): one language, plus an optional second. Works for any
           number of languages; the structure itself holds the limit of two, so no
           option ever goes grey. The first language is the PDF's first page. -->
      <label class="lab" for="lg1">Language of the report</label>
      <div class="langrow"><span class="selwrap"><select id="lg1" onchange="setLang(0, this.value)"></select><i class="ph ph-caret-down" aria-hidden="true"></i></span></div>
      <div class="langrow" id="lg2row" hidden>
        <span class="selwrap"><select id="lg2" aria-label="Second language" onchange="setLang(1, this.value)"></select><i class="ph ph-caret-down" aria-hidden="true"></i></span>
        <button class="icon-btn plain" onclick="removeSecond()" aria-label="Remove second language"><i class="ph ph-x"></i></button>
      </div>
      <button class="textbtn left" id="addLang" onclick="addSecond()"><i class="ph ph-plus" aria-hidden="true"></i>Add a second language</button>
      <p class="hint" id="lgHint" hidden>Each language gets its own page in the PDF.</p>
    </div>
    <div class="fieldset">
      <div class="switchrow">
        <label for="amtSw" class="lab" style="flex:1;text-align:left">Include amounts</label>
        <button class="switch" id="amtSw" role="switch" aria-checked="false" onclick="toggleAmounts()"></button>
      </div>
      <p class="hint" id="amtHint"></p>
    </div>
    <!-- NEW DOCTOR ONLY. What can be left out: whole sections, and single days from
         the list itself. The logged-days line and the footer always print, and the
         footer says when something was left out. The summary cannot be edited:
         to change what it says, change the record. -->
    <div class="fieldset" id="ndRows" hidden>
      <span class="lab">Show in the report</span>
      <div class="switchrow"><span style="flex:1">Plan over time</span>
        <button class="switch" id="sw-lanes" role="switch" aria-checked="true" aria-label="Plan over time" onclick="toggleShow('lanes')"></button></div>
      <div class="switchrow"><span style="flex:1">By plan</span>
        <button class="switch" id="sw-pace" role="switch" aria-checked="true" aria-label="By plan" onclick="toggleShow('pace')"></button></div>
      <div class="switchrow"><span style="flex:1">Days that stood out</span>
        <button class="switch" id="sw-days" role="switch" aria-checked="true" aria-label="Days that stood out" onclick="toggleShow('days')"></button></div>
      <button class="textbtn left" onclick="closeAdjust(); openCtx()"><i class="ph ph-note-pencil" aria-hidden="true"></i>Context for a new doctor</button>
    </div>
  </div>
</div>

<div class="sheet" id="ctxSheet" role="dialog" aria-modal="true" aria-labelledby="ctx-title">
  <div class="pull"></div>
  <div class="sh-body">
    <div class="sh-head">
      <h2 id="ctx-title">Context for a new doctor</h2>
      <button class="icon-btn plain" onclick="closeAdjust()" aria-label="Close"><i class="ph ph-x"></i></button>
    </div>
    <div class="fieldset"><label class="lab" for="cx-year">Year diagnosed</label>
      <input class="field" id="cx-year" inputmode="numeric" maxlength="4" oninput="ctx.year=this.value.replace(/\D/g,'');render()"></div>
    <div class="fieldset"><label class="lab" for="cx-cond">Other conditions</label>
      <textarea class="field" id="cx-cond" rows="2" oninput="ctx.cond=this.value;render()"></textarea></div>
    <div class="fieldset"><label class="lab" for="cx-note">Anything else the doctor should know</label>
      <textarea class="field" id="cx-note" rows="3" oninput="ctx.note=this.value;render()"></textarea></div>
  </div>
</div>
<script src="../sheet-handle.js" data-close="closeAdjust"></script>

<script src="../timefmt.js"></script>
<script src="../report-record.js"></script>

    lanesH:'用药方案的变化', paceH:'按用药方案', allDays:'所有值得注意的日子',
    tzLane:'时区', city:{ 'Asia/Tokyo':'东京' },
    rows:['有记录的天数','与计划的偏差（典型）','第一次服药（典型）','最后一次服药（典型）',
          '早餐（典型）','睡眠（典型）','有运动记录','记录到“药效减退”'],
    min:m=>`${m}分钟`, hrs:h=>`${h}小时`, few:'记录太少',
    tz:(a,b,c)=>`时间按记录时的当地时间显示。${a}至${b}为${c}时间。`,

function span(n){
  const U = { en:['days','weeks','months','years'], ja:['日間','週間','か月','年'], zh:[' 天',' 周',' 个月',' 年'] }[lang];
  if (n < 28) return lang === 'en' ? `${n} days` : `${n}${U[0]}`;
  const [v, u] = n < 91 ? [Math.round(n / 7), U[1]]
               : n < 730 ? [Math.round(n / 30.4), U[2]]
               : [Math.round(n / 365 * 10) / 10, U[3]];
  if (lang === 'ja') return `約${v}${u}（${n}日間）`;
  if (lang === 'zh') return `约 ${v}${u}（${n} 天）`;
  return `about ${v} ${u} (${n} days)`;
}
const AMT = { en:{ L:'½ tablet (100mg)', E:'1 tablet (200mg)' }, ja:{ L:'½錠（100mg）', E:'1錠（200mg）' },
              zh:{ L:'½ 片（100mg）', E:'1 片（200mg）' } };
/* drug words in each language's template, so amounts slot in after them */
const DRUG = { en:['Levodopa','Entacapone'], ja:['レボドパ','エンタカポン'], zh:['左旋多巴','恩他卡朋'] };
/* the report's languages: shown in their own names, in a fixed order.
   Japanese before Chinese: the pitch is Japan and the US first (Tutu, 2026-11-20). */
const LANGS = [['en','English'], ['ja','日本語'], ['zh','简体中文']];
const LNAME = Object.fromEntries(LANGS);
const LOCALE = { en:'en-US', ja:'ja-JP', zh:'zh-CN' };
/* only English follows the phone's 12/24h; Japanese and Chinese use 24-hour, as is usual */
const h24 = () => lang !== 'en' || document.documentElement.dataset.clock !== '12';

/* ═════════ the sample record (generated, seeded: the same every load) ═════════
   Shaped like the domain lead's pattern: five Levodopa times, an Entacapone at its
   own time, the afternoon dose often taken early, wearing off before it, and a
   later kick-in after high-protein breakfasts. Two days have no entries. */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
/* = the Medicine Cabinet's sample, so the walk-through agrees with itself. "the small
   white one" is the person's own name for a medication: shown as written, in every
   language, never renamed [AGENTS.md]. */
const PLAN = ['07:30','11:00','14:30','18:00','21:30'], ENTA = ['09:30','11:00','14:30'];
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.round(m % 60)).padStart(2, '0')}`;
const TODAY = new Date(); TODAY.setHours(12, 0, 0, 0);
const dayAt = ago => { const d = new Date(TODAY); d.setDate(d.getDate() - ago); return d; };

const N = 14, EMPTY = new Set([9, 4]);
const DAYS = [];
for (let ago = N - 1; ago >= 0; ago--){
  if (EMPTY.has(ago)){ DAYS.push({ ago, none:true }); continue; }
  const k = DAYS.length;
  const highProt = [12, 10, 7, 3, 1].includes(ago);
  const early = [13, 11, 8, 6, 5, 2, 0].includes(ago);          /* afternoon dose taken early */
  const doses = PLAN.map((p, i) => {
    let off = Math.round((rnd() - .5) * 16);
    if (i === 2 && early) off = -(22 + Math.round(rnd() * 16));
    return toMin(p) + off;
  });
  const kickLate = highProt ? ago !== 3 : [11, 6].includes(ago);  /* 4 of 5 high-protein days; 2 of 7 others */
  const kick = doses[0] + (kickLate ? 70 + Math.round(rnd() * 20) : 35 + Math.round(rnd() * 15));
  const wearing = [13, 12, 11, 8, 6, 5, 2, 0].includes(ago) ? toMin('13:40') + Math.round(rnd() * 35) : null;
  const short = [12, 6, 1].includes(ago);
  DAYS.push({ ago, doses, kick, kickLate, wearing, highProt, early, shortSleep:short,
              move: [13, 10, 8, 5, 2, 0].includes(ago), extra: [8, 2, 0].includes(ago),
              /* a dose outside the plan: a top-up, or part of a dose taken early */
              extraAt: { 8: toMin('16:20'), 2: toMin('16:40'), 0: toMin('17:20') }[ago] });
}
const LOGGED = DAYS.filter(d => !d.none);

/* ═════════ state ═════════ */
/* lang = the language being drawn right now; langs = what the report is in.
   The app around the report stays in the app's language (English in MVP). */
/* the report opens in the default report language from Settings (prefs.js) */
const START = window.DoseEggPrefs ? window.DoseEggPrefs.reportLang() : 'en';
let lang = START, langs = [START], scene = 'reg', amounts = false;
/* new doctor: what the person chose to add, leave out, or ask about */
const RL = window.RecordLong;
const ctx = { year:'', cond:'', note:'' };
let ctxAsked = false;
const show = { lanes:true, pace:true, days:true };
const hiddenDays = new Set();
const asked = new Set();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* dates and times in the page's language. English times follow the phone's 12/24h
   setting (timefmt.js sets data-clock); Japanese always uses 24-hour, as is usual. */
function fmtDate(d, withDay){
  return new Intl.DateTimeFormat(LOCALE[lang],
    withDay ? { month:'short', day:'numeric', weekday:'short' } : { month:'short', day:'numeric' }).format(d);
}
function clk(t){
  if (h24()) return t;
  const [h, m] = t.split(':').map(Number);
  return new Intl.DateTimeFormat('en-US', { hour:'numeric', minute:'2-digit', hour12:true })
    .format(new Date(2000, 0, 1, h, m));
}
const clkAll = s => s.replace(/\b([01]\d|2[0-3]):([0-5]\d)\b/g, m => clk(m));
const median = a => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

/* ═════════ the timing chart: 14 rows, 06:00 to 24:00 ═════════ */
function chartSVG(t){
  /* viewBox width close to the rendered width (phone column minus margins), so a
     14-unit label renders at about 14px: the type floor holds in the chart too [C-16] */
  const W = 310, L = 64, R = 10, top = 22, rh = 26, H = top + DAYS.length * rh + 6;
  const x = m => L + (m - 360) / (1440 - 360) * (W - L - R);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.b2}">`;
  [6, 12, 18, 24].forEach(h => {
    const X = x(h * 60);
    s += `<line x1="${X}" y1="${top - 4}" x2="${X}" y2="${H - 4}" stroke="var(--viz-grid)" stroke-width="1"/>`;
    s += `<text x="${X}" y="14" text-anchor="middle" font-size="14" fill="var(--text-muted)">${h24() ? String(h % 24).padStart(2,'0') : ((h % 12) || 12) + (h % 24 < 12 ? 'a' : 'p')}</text>`;
  });
  DAYS.forEach((d, r) => {
    const y = top + r * rh + rh / 2;
    s += `<text x="0" y="${y + 5}" font-size="14" fill="var(--text-secondary)">${fmtDate(dayAt(d.ago))}</text>`;
    if (d.none){
      s += `<rect x="${x(360) + 1}" y="${y - 7}" width="${x(1440) - x(360) - 2}" height="14" rx="3" fill="none" stroke="var(--viz-missing)" stroke-dasharray="4 3"/>`;
      return;
    }
    PLAN.forEach(p => { const X = x(toMin(p)); s += `<line x1="${X}" y1="${y - 7}" x2="${X}" y2="${y + 7}" stroke="var(--paper-300)" stroke-width="2" stroke-linecap="round"/>`; });
    d.doses.forEach(m => { s += `<circle cx="${x(m)}" cy="${y}" r="4.5" fill="var(--mark)"/>`; });
    if (d.extraAt) s += `<circle cx="${x(d.extraAt)}" cy="${y}" r="4.5" fill="var(--mark)"/>`;
    if (d.wearing) s += `<circle cx="${x(d.wearing)}" cy="${y}" r="4" fill="var(--surface-card)" stroke="var(--viz-ink)" stroke-width="1.6"/>`;
    s += `<rect x="${x(d.kick) - 3.4}" y="${y - 3.4}" width="6.8" height="6.8" transform="rotate(45 ${x(d.kick)} ${y})" fill="var(--surface-card)" stroke="var(--viz-ink)" stroke-width="1.6"/>`;
  });
  return s + '</svg>';
}

/* ═════════ the page, one template per scenario ═════════ */
function render(){
  const c = T.en;
  el('t-screen').textContent = c.screen;
  el('t-save').textContent = c.save; el('t-savehint').textContent = c.saveHint;
  el('amtHint').textContent = amounts ? c.amtOn : c.amtOff;
  el('scHint').textContent = scene === 'reg'
    ? 'The last two weeks: what changed since a doctor who knows you last saw you.'
    : 'Everything so far: the plan over time, and each plan side by side.';
  el('setsum').textContent = [scene === 'reg' ? 'Last 2 weeks · Regular doctor' : 'Everything · New doctor',
                              langs.map(l => LNAME[l]).join(' + '), amounts ? 'Amounts on' : 'Amounts off'].join(' · ');
  el('ctxcard').hidden = !(scene === 'new' && !ctxAsked);
  el('ndRows').hidden = scene !== 'new';
  const list = langs;
  el('papers').innerHTML = list.map((l, i) => {
    lang = l;
    return (list.length > 1 ? `<div class="papers-lang">${LNAME[l]}</div>` : '')
         + `<article class="paper${i ? ' next' : ''}${scene === 'new' ? ' long' : ''}" lang="${l}">${paperHTML()}</article>`;
  }).join('');
  lang = list[0];
}
/* THE MEMO FIRST (Tutu, 2026-11-09, after the slide mock). The top card is what
   the person holds up in a ten-minute visit: the one strongest thing noticed, the
   days that stood out, and the questions to discuss, with the questions as the
   one tinted block, because the point of the visit is the conversation. Calm comes
   from saying less, never from smaller type. The details follow for the doctor
   who wants the evidence, and both print on the same page. */
function paperHTML(){
  const t = T[lang], sep = lang === 'en' ? ':' : '：';
  const first = dayAt(N - 1), last = dayAt(0);
  const times = PLAN.map(clk);
  /* written with 24-hour times, then formatted once (formatting twice would double "AM") */
  let plan = clkAll(t.planLine(PLAN).replace('{E}', ENTA.join(lang === 'en' ? ', ' : '、')));
  if (amounts){ const [L, E] = DRUG[lang];
    plan = plan.replace(L, `${L} ${AMT[lang].L}`).replace(E, `${E} ${AMT[lang].E}`); }

  let title, meta, noticed, days, details = '', about = '';
  const foot = [];
  if (scene === 'reg'){
    /* computed: every number below comes from DAYS */
    const n = LOGGED.length;
    const early = LOGGED.filter(d => d.doses[2] < toMin('14:30') - 15);
    const earlyBy = median(early.map(d => toMin('14:30') - d.doses[2]));
    const off = LOGGED.filter(d => d.wearing != null);
    const offTimes = off.map(d => d.wearing).sort((a, b) => a - b);
    const offA = fromMin(Math.floor(offTimes[1] / 30) * 30), offB = fromMin(Math.ceil(offTimes[offTimes.length - 2] / 30) * 30);
    const hp = LOGGED.filter(d => d.highProt), rest = LOGGED.filter(d => !d.highProt);
    const hpLate = hp.filter(d => d.kickLate).length, restLate = rest.filter(d => d.kickLate).length;
    const F = [
      { k: off.length,  n,         html: obs(`${off.length}/${n}`, clkAll(t.obsOff(off.length, n, offA, offB))) },
      { k: early.length, n,        html: obs(`${early.length}/${n}`, clkAll(t.obsDrift(early.length, n, earlyBy))) },
      { k: hpLate,      n: hp.length, html: obs(`${hpLate}/${hp.length}`, clkAll(t.obsProt(hpLate, hp.length, restLate, rest.length))) },
    ];
    /* the memo's one finding: the strongest share among findings resting on 5+ days.
       A rule, not a judgment, so the same record always leads with the same line. */
    const lead = F.filter(f => f.n >= 5).sort((a, b) => b.k / b.n - a.k / a.n)[0];
    title = t.titleReg;
    meta = `${t.period(fmtDate(first), fmtDate(last), N)}<br>${t.coverage(n, N)}`;
    noticed = lead.html;
    days = t.notable.map(([i, txt]) => [fmtDate(dayAt([11, 6, 0][i]), true), txt]);
    details += `<section class="blk card"><h3>${t.glanceAll}</h3>
      <p class="p-meta"><b>${t.planNow}${sep}</b> ${plan}</p>
      ${F.filter(f => f !== lead).map(f => f.html).join('')}</section>`;
    details += `<section class="blk card half"><h3>${t.b2}</h3>${chartSVG(t)}
      <div class="legend"><span><i class="k dose"></i>${t.legDose}</span><span><i class="k plan"></i>${t.legPlan}</span>
        <span><i class="k off"></i>${t.legOff}</span><span><i class="k on"></i>${t.legOn}</span>
        <span><i class="k none"></i>${t.legNone}</span></div></section>`;
    const vals = [hp.length, LOGGED.filter(d => d.move).length, LOGGED.filter(d => d.shortSleep).length, LOGGED.filter(d => d.extra).length];
    details += `<section class="blk card half"><h3>${t.b3}</h3><div class="facts">${
      t.facts.map(([l, f], i) => `<div class="fact"><span class="fl">${l}</span><span class="fv">${f(vals[i], n)}</span></div>`).join('')
    }</div><p class="note-small">${t.factsNote}</p></section>`;
  } else {
    /* NEW DOCTOR: the long view, calculated from report-record.js. Two pages: the
       memo, then the plan over time and the periods side by side. */
    const n = TN[lang], P = RL.PERIODS;
    title = t.titleNew;
    meta = `${t.period(fmtDate(dayAt(RL.SPAN - 1)), fmtDate(last), RL.SPAN)}<br>${t.coverage(RL.logged, RL.SPAN)}
      <br><b>${t.planNow}${sep}</b> ${plan}`;
    if (RL.LEAD){
      const key = RL.LEAD.key;
      noticed = `<p class="lead-intro">${n.leadIntro[key]}</p><div class="facts">${
        P.filter(x => x[key]).map(x => `<div class="fact"><span class="fl">${planName(x)}<small>${range(x)}</small></span>
          <span class="fv">${n.kOfN(x[key].k, x[key].n)}</span></div>`).join('')}</div>`
        + (asked.has(key) ? '' : `<button class="addq ask-this" onclick="askAbout('${key}')"><i class="ph ph-chat-circle-text" aria-hidden="true"></i>${n.askThis}</button>`);
    } else noticed = `<p class="lead-intro">${n.nothing}</p>`;   /* ship the null result */
    const stood = RL.STOOD.filter(e => !hiddenDays.has(e.ago));
    days = show.days ? stood.slice(0, 3).map(e => [fmtDate(dayAt(e.ago), true), evText(e), e.ago]) : null;
    const parts = [ctx.year && n.diag(esc(ctx.year)), ctx.cond && `${n.cond}${sep} ${esc(ctx.cond)}`, ctx.note && esc(ctx.note)].filter(Boolean);
    about = parts.length ? `<section class="mblk"><h3>${n.about}</h3><p class="about">${parts.join('<br>')}</p></section>` : '';

    if (show.lanes) details += `<section class="blk card"><h3>${n.lanesH}</h3>${lanesSVG(n)}</section>`;
    if (show.pace){
      const tm = m => m == null ? null : clk(fromMin(m));
      const ROWS = [
        x => n.kOf(x.logged, x.days),
        x => x.drift == null ? null : n.min(x.drift),
        x => tm(x.firstDose), x => tm(x.lastDose), x => tm(x.breakfast),
        x => x.sleep == null ? null : n.hrs(x.sleep),
        x => x.move ? n.kOf(x.move.k, x.move.n) : null,
        x => x.off ? n.kOf(x.off.k, x.off.n) : null,
      ];
      details += `<section class="blk card"><h3>${n.paceH}</h3>
        <table class="tbl pace"><thead><tr><th></th>${P.map(x => `<th class="r">${range(x)}<small>${planShort(x)}</small></th>`).join('')}</tr></thead>
        <tbody>${ROWS.map((f, i) => `<tr><td>${n.rows[i]}</td>${P.map(x => { const v = f(x);
          return v == null ? `<td class="r few">${n.few}</td>` : `<td class="r">${v}</td>`; }).join('')}</tr>`).join('')}</tbody></table>
        <p class="note-small">${t.qNote}</p></section>`;
    }
    if (show.days && stood.length > 3){
      /* every day, repeats of one kind on one line (3 or more), so the list stays short */
      const lines = [];
      ['fall', 'severe', 'freeze', 'pin'].forEach(ty => {
        const g = stood.filter(e => e.type === ty);
        if (g.length >= 3) lines.push([n.grouped(g.length), `${n.ev[ty]}${sep} ${g.map(e => fmtDate(dayAt(e.ago)) + (e.note ? ` (${esc(e.note)})` : '')).join(', ')}`]);
        else g.forEach(e => lines.push([fmtDate(dayAt(e.ago), true), evText(e)]));
      });
      details += `<section class="blk card"><h3>${n.allDays}</h3><ul class="days">${
        lines.map(([d, x]) => `<li><span class="d">${d}</span><span class="dt">${x}</span></li>`).join('')}</ul></section>`;
    }
    const trip = RL.TRIP;
    foot.push(n.tz(fmtDate(dayAt(trip.from)), fmtDate(dayAt(trip.to)), n.city[trip.tz]));
    if (!show.lanes || !show.pace || !show.days || hiddenDays.size) foot.push(n.leftOut);
  }

  /* QUESTIONS: the person's own, editable here, printed as a list. The app does
     not suggest any (H-04 is held for clinical and legal review). */
  /* Zero questions is fine: on screen the block is the heading and "Add a question";
     on paper it does not print at all. */
  const Q = QS[scene][lang];
  const qs = `<section class="ask${Q.length ? '' : ' empty'}"><h3>${t.b5}</h3>
    ${Q.length ? `<ol class="qs">${Q.map((q, i) =>
      `<li><textarea rows="2" aria-label="${t.b5} ${i + 1}" oninput="QS['${scene}']['${lang}'][${i}]=this.value;this.nextElementSibling.textContent=this.value">${esc(q)}</textarea><span class="qprint">${esc(q)}</span></li>`).join('')}</ol>` : ''}

  let h = `<div class="card memo">
    <header class="p-head"><span class="p-kicker">${t.kicker}</span>
      <h2 class="p-title">${title}</h2><span class="p-meta">${meta}</span></header>
    ${about}
    <section class="mblk"><h3>${t.noticed}</h3>${noticed}</section>
    ${days ? `<section class="mblk"><h3>${t.b4}</h3><ul class="days">${
      days.map(([d, txt, ago]) => `<li><span class="d">${d}</span><span class="dt">${clkAll(txt)}</span>${ago != null
        ? `<button class="icon-btn plain hide-day" onclick="hideDay(${ago})" aria-label="Leave this day out"><i class="ph ph-eye-slash"></i></button>` : ''}</li>`).join('')}</ul></section>` : ''}
    ${qs}
  </div>`;
  h += `<div class="details-h">${t.details}</div>` + details;
  h += `<footer class="p-foot">${[t.foot1, t.foot2(fmtDate(TODAY)), ...foot].map(x => `<span>${x}</span>`).join('')}</footer>`;
  return h;
}
const obs = (cnt, txt) => `<div class="obs"><span class="cnt">${cnt}</span><p>${txt}</p></div>`;
const el = id => document.getElementById(id);

/* the questions are kept per language, so switching never loses what was typed */
const QS = { reg:{ en: [...T.en.qs], ja: [...T.ja.qs], zh: [...T.zh.qs] }, new:{ en:[], ja:[], zh:[] } };
function addQ(l){ QS[scene][l].push(''); render();
  const all = document.querySelectorAll(`.paper[lang="${l}"] .qs textarea`); all[all.length - 1].focus(); }

/* ═════════ the long view: helpers ═════════ */
function planName(x){ const m = x.plan.meds, E = m.some(d => d.key === 'ent') ? DRUG[lang][1] : null;
  return TN[lang].planName(DRUG[lang][0], m[0].times.length, E); }
function planShort(x){ const m = x.plan.meds, E = m.some(d => d.key === 'ent');
  return TN[lang].times(m[0].times.length) + (E ? ` + ${DRUG[lang][1]}` : ''); }
function range(x){ return `${fmtDate(dayAt(x.from))}–${fmtDate(dayAt(x.to))}`; }
function evText(e){ const n = TN[lang], sep = lang === 'en' ? ':' : '：';
  return e.type === 'pin' ? esc(e.note) : n.ev[e.type] + (e.note ? `${sep} ${esc(e.note)}` : ''); }

/* PLAN OVER TIME: one lane per medication across the months, each change marked.
   Same fill for every version; the text in the bar says what changed. No arrows,
   no trend line: the periods are compared side by side in the table below. */
function lanesSVG(n){
  const W = 330, S = RL.SPAN, x = ago => (S - 1 - ago) / (S - 1) * W;
  const lev = DRUG[lang][0], ent = DRUG[lang][1];
  const lanes = [
    { label: lev, segs: RL.PERIODS.map(p => ({ a:p.from, b:p.to, txt:TN[lang].times(p.plan.meds[0].times.length) })) },
    { label: ent, segs: RL.PERIODS.filter(p => p.plan.meds.some(m => m.key === 'ent')).map(p => ({ a:p.from, b:p.to, txt:TN[lang].times(3) })) },
    { label: 'the small white one', segs: RL.PERIODS.filter(p => p.plan.meds.some(m => m.key === 'own')).map(p => ({ a:p.from, b:p.to, txt:TN[lang].times(1) })) },
  ];
  const LH = 48, top = 4, H = top + lanes.length * LH + LH + 22;
  let s = `<svg class="lanes" viewBox="0 0 ${W} ${H}" role="img" aria-label="${n.lanesH}">`;
  /* months along the bottom, at the first of each month */
  const yb = H - 4;
  for (let ago = S - 1; ago >= 0; ago--){
    const d = dayAt(ago);
    if (d.getDate() !== 1) continue;
    const X = x(ago);
    s += `<line x1="${X}" y1="${yb - 22}" x2="${X}" y2="${yb - 15}" stroke="var(--text-muted)" stroke-width="1"/>`;   /* a short tick, so no line crosses a label */
    if (X < W - 24) s += `<text x="${X + 2}" y="${yb}" font-size="14" fill="var(--text-muted)">${new Intl.DateTimeFormat(LOCALE[lang], { month:'short' }).format(d)}</text>`;
  }
  lanes.forEach((ln, i) => {
    const y = top + i * LH;
    s += `<text x="0" y="${y + 14}" font-size="14" fill="var(--text-secondary)">${ln.label}</text>`;
    ln.segs.forEach(g => {
      const X1 = x(g.a) + 1, X2 = x(g.b) - 1;
      s += `<rect x="${X1}" y="${y + 20}" width="${X2 - X1}" height="22" rx="4" fill="var(--mark)"/>`;
      s += `<text x="${X1 + 6}" y="${y + 36}" font-size="14" font-weight="600" fill="var(--on-accent)">${g.txt}</text>`;
    });
  });
  /* the time zone lane: only where it was not home */
  const t = RL.TRIP, yz = top + lanes.length * LH;
  s += `<text x="0" y="${yz + 14}" font-size="14" fill="var(--text-secondary)">${n.tzLane}</text>`;
  s += `<rect x="${x(t.from)}" y="${yz + 20}" width="${Math.max(4, x(t.to) - x(t.from))}" height="22" rx="3" fill="none" stroke="var(--viz-ink)" stroke-width="1.6"/>`;
  s += `<text x="${x(t.to) + 6}" y="${yz + 36}" font-size="14" fill="var(--text-primary)">${n.city[t.tz]}</text>`;
  return s + '</svg>';
}
function askAbout(key){
  /* drafts the same question in every report language; once edited, each is the person's own */
  LANGS.forEach(([l]) => QS.new[l].push(TN[l].askDraft[key]));
  asked.add(key); render();
  const all = document.querySelectorAll(`.paper[lang="${langs[0]}"] .qs textarea`); all[all.length - 1].focus();
}
function hideDay(ago){ hiddenDays.add(ago); render(); }
function toggleShow(k){ show[k] = !show[k]; el('sw-' + k).setAttribute('aria-checked', show[k]); render(); }
function openCtx(){ ctxAsked = true; render();
  el('scrim').classList.add('open'); el('ctxSheet').classList.add('open'); el('cx-year').focus(); }
function skipCtx(){ ctxAsked = true; render(); }

function setScene(s){ scene = s; el('sc-reg').setAttribute('aria-pressed', s === 'reg'); el('sc-new').setAttribute('aria-pressed', s === 'new'); render(); }
/* LANGUAGE PICKER. langs holds one or two codes. Picking the other slot's language
   swaps the two, so the pair never holds the same language twice. */
function fillSelect(id, chosen){
  el(id).innerHTML = LANGS.map(([k, name]) =>
    `<option value="${k}" lang="${k}"${k === chosen ? ' selected' : ''}>${name}</option>`).join('');
}
function syncLangUI(){
  fillSelect('lg1', langs[0]);
  const two = langs.length > 1;
  el('lg2row').hidden = !two; el('lgHint').hidden = !two;
  el('addLang').hidden = two || LANGS.length < 2;
  if (two) fillSelect('lg2', langs[1]);
}
function setLang(i, v){
  const j = 1 - i;
  if (langs[j] === v) langs[j] = langs[i];
  langs[i] = v; syncLangUI(); render();
}
function addSecond(){
  langs.push(LANGS.find(([k]) => k !== langs[0])[0]);
  syncLangUI(); render(); el('lg2').focus();
}
function removeSecond(){ langs = [langs[0]]; syncLangUI(); render(); el('addLang').focus(); }
function openAdjust(){ el('scrim').classList.add('open'); el('sheet').classList.add('open'); el('sheet').querySelector('.seg button').focus(); }
function closeAdjust(){ el('scrim').classList.remove('open'); el('sheet').classList.remove('open'); el('ctxSheet').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAdjust(); });
function toggleAmounts(){ amounts = !amounts; el('amtSw').setAttribute('aria-checked', amounts); render(); }
/* SAVE OR SHARE. The real app makes the PDF on the phone and opens the system
   share sheet, where the person picks Files, Mail, Messages or print. The app
   itself never sends it anywhere (local export, MVP scope guard): an email is the
   person's own Mail app, sent by them. The prototype uses the browser's print,
   whose sheet on iOS offers the same save and share choices. */
function savePdf(){ window.print(); }

syncLangUI();
render();
</script>
