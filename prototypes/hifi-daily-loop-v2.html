<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DoseEgg — Today (hi-fi v2 · depth layer)</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ═══════════════════ LAYER 1 — PRIMITIVES ═══════════════════
   "Stitch blue" — swapped 2026-08-06 on the domain lead's preference. Provisional.
   Oat+petrol preserved in palette-*.html; restore by swapping this block only.
   Token names stay unchanged — they are positional, not descriptive.      */
:root{
  --paper-0:#FFFFFF; --paper-50:#F9F9FF; --paper-100:#F1F3FF; --paper-200:#E4E8F5;
  --paper-300:#D3D9E8; --paper-400:#ABB3C6; --paper-500:#7C8598; --paper-600:#5F6879;
  --paper-700:#3E4658; --paper-800:#262C3A; --paper-900:#141B2B;
  --ink-400:#4A7BC8; --ink-500:#2B5BA9; --ink-600:#1E4380; --ink-700:#143059;
  --hue-mark:#3B4E7A;   /* one mark colour — icon carries the type, colour carries nothing */
  --red-600:#A33A2A;
  --backdrop:#D9DDE8;   /* review frame only — not a product surface */
}
/* ═══════════════════ LAYER 2 — SEMANTIC ═══════════════════ */
:root{
  --surface-page:var(--paper-50); --surface-card:var(--paper-0);
  --surface-raised:var(--paper-100); --surface-sunken:var(--paper-200);
  --text-primary:var(--paper-900); --text-secondary:var(--paper-700);
  --text-muted:var(--paper-600); --text-inverse:var(--paper-50);
  --border-subtle:var(--paper-200); --border-interactive:var(--paper-500);
  --accent:var(--ink-500); --accent-hover:var(--ink-600); --accent-quiet:var(--ink-400);
  --on-accent:var(--paper-0);
  --mark:var(--hue-mark);
  --focus-ring:var(--ink-500); --focus-ring-width:3px; --focus-ring-offset:2px;
  --feedback-error:var(--red-600);

  --font-serif:'Newsreader',Georgia,serif;
  --font-sans:'Inter',-apple-system,system-ui,sans-serif;
  --text-display:2rem; --text-title:1.5rem; --text-heading:1.1875rem;
  --text-body:1.0625rem; --text-small:1rem; --text-label:.875rem;
  --leading-tight:1.2; --leading-body:1.55;

  --motion-fast:120ms; --motion-base:200ms; --motion-slow:320ms;
  --ease-out:cubic-bezier(.2,0,0,1);

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:999px;

  /* Touch targets — three tiers by context of use. Separate tokens even where the
     value matches today, so each can move independently. See design-tokens.html. */
  --target-min:48px;        /* floor, everything */
  --target-routine:48px;    /* ordinary moments: dose confirm, tiles, nav */
  --target-critical:56px;   /* low-capacity: FOG, low energy, FAB */
  --target-gap:16px;        /* between adjacent targets — separation beats height */

  /* ── tunable while we compare — fold back into the scale once settled ── */
  --gutter:16px;        /* page side margin */
  --rail-indent:52px;   /* clears the marker + rail */
  --card-pad:16px;      /* inside the entry card */
  /* Rail geometry — derived from the 36px mark, so they move together.
     Named rather than left as bare numbers: 17 and 14 are not arbitrary, they
     centre the rail and its terminus under the mark. */
  --rail-x:17px;        /* rail centre = (mark 36 / 2) - (rail 1.5 / 2) */
  --rail-dot:7px;       /* terminus diameter */
  --rail-dot-x:14px;    /* terminus left = rail-x - (dot - rail width)/2 */
  --rail-dot-y:6px;     /* terminus sits just inside the last entry's padding */
  --meta-gap:5px;       /* icon → value inside a metadata pair. Optical, not scale. */
  --text-meta:.875rem;  /* metadata, chips, timestamps — 14px floor */

  --shell-w:420px;      /* review-frame width — the toast is sized against this */
}
@media (prefers-reduced-motion:reduce){
  :root{--motion-fast:0ms;--motion-base:0ms;--motion-slow:0ms}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ═══════════════════ base ═══════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%}
html[data-text-scale="large"]{font-size:112.5%}   /* 18px */
html[data-text-scale="larger"]{font-size:125%}    /* 20px */
html[data-text-scale="huge"]{font-size:150%}      /* 24px */
html[data-text-scale="max"]{font-size:200%}       /* 32px — WCAG 1.4.4 corner case */
body{margin:0;background:var(--backdrop);font-family:var(--font-sans);
     font-size:var(--text-body);line-height:var(--leading-body);
     color:var(--text-primary);-webkit-font-smoothing:antialiased;
     display:flex;justify-content:center;min-height:100vh}
/* dvh = DYNAMIC viewport height. Plain `vh` on a phone is measured against the
   browser window with its toolbars HIDDEN, so 100vh is always taller than what
   you can actually see — the bottom of the page sits behind the URL bar. `dvh`
   tracks the toolbar as it collapses and expands. Declared second so browsers
   that don't know dvh keep the vh line above. */
@supports (height:100dvh){ body{min-height:100dvh} .shell{min-height:100dvh} }
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);
               outline-offset:var(--focus-ring-offset);border-radius:var(--radius-sm)}

/* phone shell — review frame only, not part of the design */
.shell{width:100%;max-width:var(--shell-w);background:var(--surface-page);min-height:100vh;
       position:relative;display:flex;flex-direction:column;
       box-shadow:0 0 0 1px rgba(0,0,0,.06)}

/* ── demo bar (dev only) ── */
.demo-bar{display:flex;gap:var(--space-2);padding:var(--space-2) var(--space-3);
          background:var(--paper-800);align-items:center;flex-wrap:wrap}
.demo-bar .db{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
              color:var(--paper-400);margin-right:auto;font-weight:500}
.demo-btn{font-size:12px;font-weight:500;color:var(--paper-100);
          background:rgba(255,255,255,.12);padding:5px 10px;border-radius:var(--radius-full);
          display:flex;align-items:center;min-height:32px;text-decoration:none}
.demo-btn:hover{background:rgba(255,255,255,.2)}
/* Home lives in the demo bar, not in a floating pill over the app.
   The other prototypes overlay an inline-styled 10px pill on the phone frame —
   it covers product UI and sits below the 14px floor [C-16]. This link is review
   chrome, same category as "reset", so it belongs with the review chrome and
   disappears with it when the demo bar is deleted. */
.demo-btn.home{background:rgba(255,255,255,.22);font-weight:600}
.tuner{display:none;grid-template-columns:1fr 1fr;gap:var(--space-2) var(--space-3);
       padding:var(--space-3);background:var(--paper-800);border-top:1px solid rgba(255,255,255,.1)}
.tuner.open{display:grid}
.tuner label{font-size:11px;color:var(--paper-400);display:flex;flex-direction:column;gap:3px}
.tuner select{font-size:12px;padding:4px 6px;border-radius:var(--radius-sm);
              background:rgba(255,255,255,.1);color:var(--paper-50);border:none;font-family:inherit}
.tuner select option{background:var(--paper-800);color:var(--paper-100)}

/* ── top bar ── */
.top{display:flex;align-items:center;justify-content:space-between;
     padding:var(--space-4) var(--space-4) var(--space-2)}
.top h1{font-family:var(--font-serif);font-size:var(--text-title);font-weight:400;
        line-height:var(--leading-tight);margin:0;color:var(--text-primary)}
.icon-btn{width:var(--target-min);height:var(--target-min);display:flex;align-items:center;
          justify-content:center;border-radius:var(--radius-full);color:var(--text-muted);
          flex:0 0 auto}
.icon-btn i{font-size:22px}
.icon-btn:hover{background:var(--surface-raised)}
.top .icon-btn:first-child{margin-left:calc(var(--space-3) * -1)}
.top .icon-btn:last-child{margin-right:calc(var(--space-3) * -1)}

.scroll{flex:1;overflow-y:auto;padding:0 var(--gutter) 120px}

/* ── confirmation card ── */
.confirm{background:var(--surface-card);border:1px solid var(--border-subtle);
         border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-6);
         animation:rise var(--motion-base) var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.confirm-q{font-size:var(--text-heading);font-weight:600;margin-bottom:2px}
.confirm-meta{font-size:var(--text-label);color:var(--text-muted);margin-bottom:var(--space-4)}
/* v2: two answers, not three options. "Did you take it?" has exactly two answers;
   the third button in v1 ("Edit") was a modifier on Yes wearing an answer's clothes,
   and at 17px "Not exactly" wrapped to two lines inside a one-third column.
   Splitting it out fixes the semantics and removes the width ceiling at once. */
.c-actions{display:flex;gap:var(--target-gap);flex-wrap:wrap}
.c-btn{flex:1 1 6rem;min-height:var(--target-routine);border-radius:var(--radius-md);
       font-weight:500;font-size:var(--text-small);background:var(--surface-page);
       border:1px solid var(--border-interactive);color:var(--text-primary);
       padding:var(--space-2) var(--space-3);
       transition:background var(--motion-fast) var(--ease-out)}
.c-btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.c-btn.primary:hover{background:var(--accent-hover)}
.c-btn:not(.primary):hover{background:var(--surface-raised)}
/* The third path. Quiet by weight and hue, never by size or contrast [C-16]. */
.c-more{display:flex;align-items:center;justify-content:center;gap:var(--space-2);
        width:100%;min-height:var(--target-min);margin-top:var(--target-gap);
        font-size:var(--text-small);font-weight:400;color:var(--accent);
        border-radius:var(--radius-md)}
.c-more i{font-size:18px}
.c-more:hover{background:var(--surface-raised)}

/* ── timeline ──────────────────────────────────────────────────
   A continuous rail, not a stack of rows. The line is the point:
   it says time passed between these, and that the day is one thing. */
.day-label{font-size:var(--text-label);letter-spacing:.08em;text-transform:uppercase;
           color:var(--text-muted);margin:var(--space-6) 0 var(--space-3);font-weight:500}
.day-label:first-child{margin-top:0}

/* Oura's structural move: the TIME sits on the rail row, next to the marker —
   outside the card. The card hangs below it. That is what makes it read as a
   timeline rather than a list of cards. */
.rail{position:relative;padding-bottom:var(--space-2)}
.rail::before{content:'';position:absolute;left:var(--rail-x);top:16px;bottom:10px;width:1.5px;
              background:var(--border-subtle)}
/* terminus — the rail is punctuated, not cut off */
.rail::after{content:'';position:absolute;left:var(--rail-dot-x);bottom:var(--rail-dot-y);width:var(--rail-dot);height:var(--rail-dot);
             border-radius:50%;background:var(--border-subtle)}

.entry{position:relative;display:block;width:100%;text-align:left;
       padding:0 0 var(--space-6) var(--rail-indent)}
.emark{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:var(--radius-full);
       display:flex;align-items:center;justify-content:center;z-index:2;
       box-shadow:0 0 0 4px var(--surface-page)}
.emark i{font-size:18px;color:#fff}
/* epistemic state — fill & outline, never hue.
   Hollow marks fill with the page colour so the rail doesn't run through them. */
.emark.assumed{background:var(--surface-page)!important;
               border:1.5px solid var(--border-interactive)}
.emark.assumed i{color:var(--text-muted);font-size:17px}
.emark.declined{background:var(--surface-page)!important;border:1.5px solid currentColor}
.emark.declined i{font-size:17px}

.etime{display:block;font-size:var(--text-meta);color:var(--text-muted);font-weight:500;
       font-variant-numeric:tabular-nums;padding:var(--space-2) 0 var(--space-2)}
.ecard{display:block;background:var(--surface-card);border:1px solid var(--border-subtle);
       border-radius:var(--radius-lg);padding:var(--card-pad);
       transition:background var(--motion-fast) var(--ease-out);position:relative}
.entry:hover .ecard{background:var(--surface-raised)}
.ecard .chev{position:absolute;right:var(--space-4);top:50%;transform:translateY(-50%);
             color:var(--paper-400);font-size:18px;display:flex}
.etext{display:block;font-size:var(--text-small);font-weight:600;color:var(--text-primary);
       line-height:1.35;padding-right:var(--space-6)}
.emeta{display:flex;gap:var(--space-4);margin-top:var(--space-2);flex-wrap:wrap}
.emeta span{font-size:var(--text-meta);color:var(--text-muted);display:flex;
            align-items:center;gap:var(--meta-gap)}
.emeta i{font-size:15px}
.enote{display:inline-block;font-size:var(--text-meta);color:var(--text-secondary);
       background:var(--surface-sunken);border-radius:var(--radius-sm);
       padding:3px var(--space-2);margin-top:var(--space-3)}
.entry.ahead{opacity:.55}
.entry.ahead .emark{border-style:dashed}
.entry.ahead .ecard{background:transparent;border-style:dashed}

/* ── new-entry highlight ───────────────────────────────────────────────
   Replaces the "X — added" toast. The entry appearing on the rail at the
   right time IS the confirmation; this just makes sure you see which one
   is new. A background wash only — no colour, no scale, no motion that
   could read as congratulation [C-08]. The fade-out comes free from
   .ecard's existing background transition when the class is removed.
   Deliberately not a keyframe animation: the reduced-motion rule zeroes
   animation durations, which would delete the feedback rather than calm
   it. A wash that simply appears and later disappears still works. */
.entry.fresh .ecard{background:var(--surface-raised);
                    border-color:var(--border-interactive)}

/* ── removal tombstone ─────────────────────────────────────────────────
   The one case that genuinely needs undo: the evidence is gone, so nothing
   on screen can confirm what happened. It stays in the rail, in the dead
   entry's own position, naming what was removed — and it has NO timer.
   A timed target is the wrong affordance for an audience with bradykinesia
   (and fails WCAG 2.2.1). It clears when the next removal happens. */
.tomb{position:relative;display:block;width:100%;
      padding:0 0 var(--space-6) var(--rail-indent)}
.tomb .emark{background:var(--surface-page)!important;
             border:1.5px dashed var(--border-interactive)}
.tomb .emark i{color:var(--text-muted);font-size:16px}
.tomb-card{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;
           background:transparent;border:1px dashed var(--border-subtle);
           border-radius:var(--radius-lg);padding:var(--space-2) var(--card-pad)}
.tomb-text{flex:1 1 10ch;min-width:0;font-size:var(--text-small);color:var(--text-muted)}
.tomb-text b{font-weight:500;color:var(--text-secondary)}
.tomb-undo{flex:0 0 auto;display:flex;align-items:center;gap:var(--space-2);
           min-height:var(--target-min);padding:0 var(--space-3);
           border-radius:var(--radius-md);font-size:var(--text-small);
           font-weight:500;color:var(--accent)}
.tomb-undo i{font-size:18px}
.tomb-undo:hover{background:var(--surface-raised)}

/* elapsed time, shown only for gaps worth noticing */
.gap{position:relative;padding:0 0 var(--space-6) var(--rail-indent);z-index:1}
.gap span{position:absolute;left:0;top:-4px;width:36px;text-align:center;
          font-size:var(--text-label);color:var(--text-muted);background:var(--surface-page);
          padding:var(--space-1) 0;font-variant-numeric:tabular-nums}

/* now */
.now{position:relative;padding:0 0 var(--space-6) var(--rail-indent);z-index:2}
.now::before{content:'';position:absolute;left:12px;top:2px;width:11px;height:11px;
             border-radius:50%;background:var(--accent);
             box-shadow:0 0 0 4px var(--surface-page)}
.now span{font-size:var(--text-label);color:var(--accent);font-weight:600;
          letter-spacing:.04em;font-variant-numeric:tabular-nums}

.empty-day{font-size:var(--text-small);color:var(--text-muted);padding:var(--space-4) 0 var(--space-6)}

/* first-run empty state */
.empty{text-align:center;padding:var(--space-12) var(--space-4)}
.empty .mark{font-size:40px;margin-bottom:var(--space-4);color:var(--accent-quiet)}
.empty h2{font-family:var(--font-serif);font-size:var(--text-title);font-weight:400;
          margin:0 0 var(--space-2)}
.empty p{font-size:var(--text-small);color:var(--text-secondary);margin:0 auto;max-width:30ch}

/* ── FAB ────────────────────────────────────────────────────────────────
   v2: pinned to the VIEWPORT, not to the page.
   It was `position:absolute` inside .shell, which anchors it to the bottom of
   the phone shell — and on a phone the shell's bottom is below the fold. Now a
   fixed "dock" spans the shell's width and the button sits inside it.

   Why a dock instead of just `position:fixed` on the button: a fixed element is
   positioned against the viewport, but the shell is centred with a max-width, so
   `right:16px` would pin it to the browser edge on desktop, not the phone frame.
   Centring it needs a transform — and .fab already uses transform for its press
   animation. Two rules writing the same property is a bug waiting to happen, so
   the dock owns the centring and the button keeps its transform. No tab bar
   required: a dock is just an empty fixed strip. */
.fab-dock{position:fixed;left:50%;transform:translateX(-50%);
          width:100%;max-width:var(--shell-w);
          bottom:calc(var(--space-6) + env(safe-area-inset-bottom));
          padding:0 var(--space-4);display:flex;justify-content:flex-end;
          z-index:40;
          /* the strip is invisible and must not swallow taps meant for the
             timeline underneath — only the button itself is tappable */
          pointer-events:none}
.fab{pointer-events:auto;
     width:var(--target-critical);height:var(--target-critical);
     border-radius:var(--radius-full);background:var(--accent);
     color:var(--on-accent);display:flex;align-items:center;justify-content:center;
     box-shadow:0 3px 12px rgba(43,91,169,.28);
     transition:transform var(--motion-fast) var(--ease-out),background var(--motion-fast)}
.fab i{font-size:28px}
.fab:hover{background:var(--accent-hover)}
.fab:active{transform:scale(.94)}

/* ── sheets ── */
.scrim{position:fixed;inset:0;background:rgba(26,25,22,.34);opacity:0;pointer-events:none;
       transition:opacity var(--motion-base) var(--ease-out);z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translate(-50%,102%);bottom:0;width:100%;
       display:flex;flex-direction:column;gap:var(--space-6);
       max-width:var(--shell-w);background:var(--surface-card);
       border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:60;
       padding:var(--space-2) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom));
       transition:transform var(--motion-slow) var(--ease-out);
       box-shadow:0 -3px 24px rgba(26,25,22,.10)}
.sheet.open{transform:translate(-50%,0)}
/* The detail sheet can outgrow the screen at large text scales — it scrolls
   rather than clipping. AGENTS.md: no fixed-height text containers. */
.sheet.tall{max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
@supports (height:100dvh){ .sheet.tall{max-height:88dvh} }
.pull{width:40px;height:4px;border-radius:var(--radius-full);background:var(--paper-300);
      margin:var(--space-2) auto 0;flex:0 0 auto}
.sheet h2{font-family:var(--font-serif);font-size:var(--text-title);font-weight:400;
          margin:0;line-height:var(--leading-tight)}

.quick-row{display:flex;gap:var(--target-gap);flex-wrap:wrap}
/* Icons removed 2026-08-11. On the small buttons they rendered at 19-20px
   against the grid tiles' 38px badges, so three different icon sizes were
   competing in one sheet. Dropping them lets every label in the sheet start on
   the same left edge — .strip, .quick and .tile all pad by --space-4 — which is
   a stronger ordering signal than the icons were providing.
   Trade-off worth watching: the quick row is the low-capacity surface, and an
   icon aids recognition under stress. The labels are short and unlike each
   other, so text alone should hold. The alternative fix was normalising the
   icon sizes rather than removing them — revisit if this tests badly. */
.quick{flex:1 1 8rem;min-height:var(--target-critical);display:flex;align-items:center;
       justify-content:flex-start;background:var(--surface-raised);
       border:1px solid var(--border-subtle);
       border-radius:var(--radius-md);font-size:var(--text-small);font-weight:500;
       padding:var(--space-3) var(--space-4);text-align:left;
       transition:background var(--motion-fast),border-color var(--motion-fast)}
.quick:hover{background:var(--surface-sunken)}
.quick.flash{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

#log-body{display:flex;flex-direction:column;gap:var(--space-6)}
.log-head{display:flex;align-items:center;gap:var(--space-2)}
.backbtn{width:var(--target-min);height:var(--target-min);display:flex;align-items:center;
         justify-content:center;border-radius:var(--radius-full);color:var(--text-secondary);
         margin-left:calc(var(--space-3) * -1);flex:0 0 auto}
.backbtn i{font-size:22px}
.backbtn:hover{background:var(--surface-raised)}

/* Sheet rhythm — two values, and only ONE place each is set.
   BETWEEN groups: --space-6 (24), set once as the sheet's flex `gap`. Children carry
   no vertical margins at all, so reordering them can never open or close a gap. That
   was a real bug three times running: spacing that lived on one child's margin-bottom
   silently disappeared when something moved above or below it.
   WITHIN a group of adjacent targets: --target-gap (16). Accessibility rule, not taste. */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--target-gap)}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-3);
      padding:var(--space-4);background:var(--surface-page);border:1px solid var(--border-subtle);
      border-radius:var(--radius-md);min-height:96px;text-align:left;
      transition:background var(--motion-fast),border-color var(--motion-fast)}
.tile:hover{background:var(--surface-raised);border-color:var(--border-interactive)}
.tile-ico{width:38px;height:38px;border-radius:var(--radius-full);display:flex;
          align-items:center;justify-content:center;flex:0 0 auto}
.tile-ico i{font-size:20px;color:#fff}
.tile-name{font-size:var(--text-small);font-weight:500}
.strip{display:flex;align-items:center;gap:var(--space-3);min-height:var(--target-min);
       padding:var(--space-3) var(--space-4);background:var(--surface-page);
       border:1px dashed var(--border-interactive);border-radius:var(--radius-md);width:100%;
       text-align:left;font-size:var(--text-small)}
/* same label treatment as .tile-name, so Photo reads as a peer of the grid */
.strip-name{font-size:var(--text-small);font-weight:500}
.strip .sub{color:var(--text-muted);font-size:var(--text-label);font-weight:400}
.strip:hover{background:var(--surface-raised)}

/* ═══════════════ DETAIL SHEET (new in v2) ═══════════════
   Two jobs, deliberately kept apart:
     CORRECT  — what actually happened. Changes the doctor export. High stakes.
     ENRICH   — optional context. Low stakes, high frequency.
   Everything writes to the record the moment it is tapped, so closing the sheet
   at any point leaves a valid entry. [C-09: a partial entry is a valid entry] */
#detail-body{display:flex;flex-direction:column;gap:var(--space-6)}
.sec{display:flex;flex-direction:column;gap:var(--space-3)}
.sec-h{font-size:var(--text-meta);letter-spacing:.08em;text-transform:uppercase;
       color:var(--text-muted);font-weight:500}
.sec-opt{text-transform:none;letter-spacing:0}
.d-head{display:flex;align-items:flex-start;gap:var(--space-3)}
.d-head .emark{position:static;box-shadow:none;flex:0 0 auto}
.d-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.d-title strong{font-family:var(--font-serif);font-size:var(--text-title);font-weight:400;
                line-height:var(--leading-tight);word-break:break-word;text-align:left}
/* The name is editable, and says so the same way the time does — dotted
   underline plus a pencil. One grammar for "this value can be changed". */
.d-title-btn{display:flex;align-items:center;gap:var(--space-3);min-height:var(--target-min);
             text-align:left;border-radius:var(--radius-sm)}
.d-title-btn strong{border-bottom:2px dotted var(--border-interactive);padding-bottom:2px}
.d-title-btn > i{font-size:19px;color:var(--text-muted);flex:0 0 auto}
.lbl-in{width:100%;font-family:var(--font-serif);font-size:var(--text-title);font-weight:400;
        min-height:var(--target-critical);color:var(--text-primary);
        background:var(--surface-page);border:1px solid var(--border-interactive);
        border-radius:var(--radius-md);padding:0 var(--space-3)}
.lbl-in:focus{outline:none;border-color:var(--accent);
              box-shadow:0 0 0 var(--focus-ring-width) rgba(43,91,169,.18)}
.d-title span{font-size:var(--text-meta);color:var(--text-muted)}

/* Basis — the one control that changes what a doctor sees.
   Collapsed to a status row when the fact is settled; expanded when it is not. */
.basis-row{display:flex;align-items:center;gap:var(--space-3);min-height:var(--target-min);
           width:100%;text-align:left;padding:var(--space-2) var(--space-3);
           background:var(--surface-page);border:1px solid var(--border-subtle);
           border-radius:var(--radius-md)}
.basis-row:hover{background:var(--surface-raised)}
.basis-row > i{font-size:22px;color:var(--text-muted);flex:0 0 auto}
.basis-row .bt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.basis-row .bt b{font-size:var(--text-small);font-weight:500}
.basis-row .bt em{font-size:var(--text-meta);color:var(--text-muted);font-style:normal}
.basis-row .act{font-size:var(--text-meta);color:var(--accent);font-weight:500;flex:0 0 auto}
/* Stacked, not segmented: three side-by-side labels wrap into unreadable
   two-line stacks at 150%+, and stacking buys a bigger target per option. */
.opts{display:flex;flex-direction:column;gap:var(--target-gap)}
.opt{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
     min-height:var(--target-critical);padding:var(--space-2) var(--space-3);
     background:var(--surface-page);border:1px solid var(--border-subtle);
     border-radius:var(--radius-md);
     transition:background var(--motion-fast),border-color var(--motion-fast)}
.opt:hover{background:var(--surface-raised)}
.opt.on{border-color:var(--accent);background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--accent)}
.opt > i{font-size:22px;color:var(--text-muted);flex:0 0 auto}
.opt.on > i{color:var(--accent)}
.opt .ot{display:flex;flex-direction:column;gap:1px;min-width:0}
.opt .ot b{font-size:var(--text-small);font-weight:500}
.opt .ot em{font-size:var(--text-meta);color:var(--text-muted);font-style:normal}

/* Time — nudges, not a scroll picker. A ±15 button is a single tap that
   tolerates tremor; a wheel picker demands sustained fine control. */
.timeval{font-family:var(--font-serif);font-size:var(--text-display);font-weight:400;
         font-variant-numeric:tabular-nums;line-height:1}
.timesub{font-size:var(--text-meta);color:var(--text-muted)}
/* Duration sits with the time, not under "context". How long something lasted
   is a temporal fact — for an activity it is arguably the point, since the
   dose-response question is about how much movement happened, not that some
   happened. Burying it in optional context made it invisible. */
.durrow{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.durlabel{font-size:var(--text-meta);color:var(--text-muted)}
/* The time is a button — tapping it swaps in numeric fields. Signalled with a
   dotted underline and a pencil, because a big number alone reads as output. */
.timeval-btn{display:flex;align-items:center;gap:var(--space-3);
             min-height:var(--target-routine);padding:0;border-radius:var(--radius-sm)}
.timeval-btn .timeval{border-bottom:2px dotted var(--border-interactive);
                      padding-bottom:2px}
.timeval-btn i{font-size:20px;color:var(--text-muted)}
/* Numeric fields, not a wheel. A wheel picker is a DRAG gesture, and Nunes et
   al. (2016) found people with PD do better with multiple-tap than drag; a
   numeric keypad is pure tapping. It is also the accessible baseline the date-
   input literature keeps arriving at — a picker should always be optional. */
.timefields{display:flex;align-items:center;gap:var(--space-2)}
.tf{width:3.5ch;min-height:var(--target-critical);text-align:center;
    font-family:var(--font-serif);font-size:var(--text-display);font-weight:400;
    font-variant-numeric:tabular-nums;color:var(--text-primary);
    background:var(--surface-page);border:1px solid var(--border-interactive);
    border-radius:var(--radius-md);padding:0 var(--space-2)}
.tf:focus{outline:none;border-color:var(--accent);
          box-shadow:0 0 0 var(--focus-ring-width) rgba(43,91,169,.18)}
.tf-sep{font-family:var(--font-serif);font-size:var(--text-display);
        color:var(--text-muted)}
.tf-set{margin-left:auto;min-height:var(--target-routine);padding:0 var(--space-4);
        border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);
        font-size:var(--text-small);font-weight:500}
.nudges{display:flex;gap:var(--target-gap);flex-wrap:wrap}
.nudge{flex:1 1 4.5rem;min-height:var(--target-routine);border-radius:var(--radius-md);
       background:var(--surface-page);border:1px solid var(--border-interactive);
       font-size:var(--text-small);font-weight:500;font-variant-numeric:tabular-nums;
       padding:var(--space-2)}
.nudge:hover{background:var(--surface-raised)}
/* Disabled rather than hidden. Hiding would reflow the row and move the
   remaining targets under the user's thumb between taps — the one thing you
   never do to someone with a tremor. Lower contrast is normally banned as a
   "quiet" lever [C-16]; unavailability is the standing exception, since the
   control must read as unavailable to anyone. */
.nudge[disabled]{color:var(--text-muted);border-color:var(--border-subtle);
                 background:transparent;cursor:not-allowed}
.nudge[disabled]:hover{background:transparent}
.nowbtn{display:flex;align-items:center;justify-content:center;gap:var(--space-2);
        width:100%;min-height:var(--target-routine);border-radius:var(--radius-md);
        border:1px solid var(--border-interactive);background:var(--surface-page);
        font-size:var(--text-small);font-weight:500}
.nowbtn i{font-size:18px;color:var(--text-muted)}
.nowbtn:hover{background:var(--surface-raised)}
.nowbtn[disabled]{color:var(--text-muted);border-color:var(--border-subtle);
                  background:transparent;cursor:not-allowed}

/* Context — unset fields are invitations (chips), set fields are facts (rows). */
.chips{display:flex;gap:var(--target-gap);flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:var(--space-2);min-height:var(--target-routine);
      padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);
      background:var(--surface-page);border:1px dashed var(--border-interactive);
      font-size:var(--text-small);color:var(--text-secondary)}
.chip i{font-size:18px;color:var(--text-muted);flex:0 0 auto}
.chip:hover{background:var(--surface-raised)}
.chip.set{border-style:solid;border-color:var(--border-subtle);background:var(--surface-raised);
          color:var(--text-primary)}
.chip.set i{color:var(--accent)}
.chip.pick{border-style:solid}
.chip.pick.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.pick.on i{color:var(--on-accent)}
.picker{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3);
        background:var(--surface-page);border:1px solid var(--border-subtle);
        border-radius:var(--radius-md)}
.picker .pl{font-size:var(--text-meta);color:var(--text-muted)}
.note-in{width:100%;font:inherit;font-size:var(--text-small);color:var(--text-primary);
         background:var(--surface-page);border:1px solid var(--border-subtle);
         border-radius:var(--radius-md);padding:var(--space-3);resize:vertical;
         min-height:calc(var(--target-min) * 1.6);line-height:var(--leading-body)}
.note-in:focus{border-color:var(--accent);outline:none;
               box-shadow:0 0 0 var(--focus-ring-width) rgba(43,91,169,.18)}

.d-done{min-height:var(--target-critical);border-radius:var(--radius-md);
        background:var(--accent);color:var(--on-accent);font-weight:500;
        font-size:var(--text-small);width:100%}
.d-done:hover{background:var(--accent-hover)}
/* Destructive, and coloured as such. This is a UI action, not health data —
   the red/green ban in AGENTS.md is about never scoring a person's symptoms. */
.d-remove{display:flex;align-items:center;justify-content:center;gap:var(--space-2);
          min-height:var(--target-min);width:100%;font-size:var(--text-small);
          color:var(--feedback-error);font-weight:500;border-radius:var(--radius-md)}
.d-remove i{font-size:19px}
.d-remove:hover{background:var(--surface-raised)}

</style>
</head>
<body>
<div class="shell">

  <div class="demo-bar">
    <a class="demo-btn home" href="../index.html">← Home</a>
    <span class="db">Hi-fi · Today · v2</span>
    <button class="demo-btn" onclick="demoAddDose()">+ due dose</button>
    <button class="demo-btn" onclick="demoEmpty()">empty</button>
    <button class="demo-btn" onclick="toggleTuner()">tune ▾</button>
    <button class="demo-btn" onclick="location.reload()">reset</button>
  </div>

  <!-- temporary tuning panel — delete before this becomes real -->
  <div class="tuner" id="tuner">
    <label>Text scale
      <select onchange="setScale(this.value)">
        <option value="">100% (default)</option>
        <option value="large">112.5%</option>
        <option value="larger">125%</option>
        <option value="huge">150%</option>
        <option value="max">200% · WCAG 1.4.4</option>
      </select></label>
    <label>Card padding
      <select onchange="setVar('--card-pad',this.value)">
        <option value="12px">12</option><option value="16px" selected>16</option>
        <option value="20px">20</option></select></label>
    <label>Rail indent
      <select onchange="setVar('--rail-indent',this.value)">
        <option value="44px">44</option><option value="52px" selected>52</option>
        <option value="60px">60</option></select></label>
    <label>Gutter
      <select onchange="setVar('--gutter',this.value)">
        <option value="12px">12</option><option value="16px" selected>16</option>
        <option value="20px">20</option></select></label>
    <label>Meta / chip size
      <select onchange="setVar('--text-meta',this.value)">
        <option value="12px">12 · below floor</option>
        <option value="13px">13 · below floor</option>
        <option value="0.875rem" selected>14 · floor</option>
        <option value="1rem">16</option></select></label>
    <label>Routine target
      <select onchange="setVar('--target-routine',this.value)">
        <option value="44px">44</option><option value="48px" selected>48</option>
        <option value="52px">52</option><option value="56px">56</option></select></label>
    <label>Critical target
      <select onchange="setVar('--target-critical',this.value)">
        <option value="48px">48</option><option value="56px" selected>56</option>
        <option value="64px">64</option></select></label>
    <label>Target gap
      <select onchange="setVar('--target-gap',this.value)">
        <option value="8px">8 · old</option><option value="16px" selected>16</option>
        <option value="24px">24</option></select></label>
  </div>

  <div class="top">
    <button class="icon-btn" aria-label="Menu"><i class="ph ph-list"></i></button>
    <h1>Today</h1>
    <button class="icon-btn" aria-label="More"><i class="ph ph-dots-three"></i></button>
  </div>

  <div class="scroll" id="scroll">
    <div id="card-area"></div>
    <div id="timeline"></div>
  </div>

</div>

<!-- Outside .shell: the dock is fixed to the viewport, so nesting it in a
     positioned ancestor would only reintroduce the problem it solves. -->
<div class="fab-dock">
  <button class="fab" id="fab" onclick="openSheet('sheet-log')" aria-label="Add to today">
    <i class="ph ph-plus"></i>
  </button>
</div>

<div class="scrim" id="scrim" onclick="closeSheets()"></div>

<!-- ══ Quick Log sheet ══ -->
<div class="sheet" id="sheet-log" role="dialog" aria-label="Add to today" tabindex="-1">
  <div class="pull"></div>
  <div id="log-body"></div>
</div>

<!-- ══ Entry detail sheet (v2) — contents rendered from state ══ -->
<div class="sheet tall" id="sheet-detail" role="dialog" aria-label="Entry detail" tabindex="-1">
  <div class="pull"></div>
  <div id="detail-body"></div>
</div>


<script>
/* ═════════ state ═════════
   Entry shape follows docs/entry-schema.md:
   type   = dose | symptom | activity | meal | note
   basis  = asserted | declined | assumed
   fields = editable context, keyed by CONTEXT below
   meta   = derived/computed display pairs the user cannot edit here
   note   = free text  [C-12: stored raw so phrases can be tagged later] */
const ICON = { dose:'ph-pill', symptom:'ph-waveform', activity:'ph-footprints',
               meal:'ph-fork-knife', note:'ph-note-pencil' };
const TYPE_NAME = { dose:'Medication', symptom:'How I feel', activity:'Activity',
                    meal:'Food', note:'Note' };
const MARK = 'var(--mark)';   /* one colour for every type — the icon does the work */

/* v2: days are data, not two hand-wired arrays. Past days are editable — people
   remember things late, and a record you cannot correct is a record you stop trusting. */
let DAYS = [
  { label:'Today', live:true, list:[
    { time:'10:00', text:'Walk', type:'activity', basis:'asserted',
      fields:{ dur:'20 min' }, meta:[['ph-map-pin','Around the block']] },
    { time:'09:40', text:'Meds kicked in', type:'symptom', basis:'asserted',
      meta:[['ph-clock','85 min after dose']] },
    { time:'08:15', text:'Levodopa 100mg', type:'dose', basis:'asserted',
      fields:{ meal:'With food' } }
  ]},
  { label:'Yesterday', live:false, list:[
    { time:'14:10', text:'Levodopa 100mg', type:'dose', basis:'asserted',
      meta:[['ph-clock','40 min late']] },
    { time:'12:00', text:'Lunch', type:'meal', basis:'asserted', fields:{ protein:'High' } },
    /* seeded unresolved so the confirm/correct path is demoable on load */
    { time:'08:20', text:'Levodopa 100mg', type:'dose', basis:'assumed' }
  ]}
];

/* Optional context, per type. Adding a field here adds it to the sheet — no other edits.
   Deliberately one field each: this is enrichment, not a form to complete. */
const CONTEXT = {
  dose:     [ { key:'meal',    label:'Food',     icon:'ph-fork-knife',
                choices:['Before food','With food','After food'] } ],
  meal:     [ { key:'protein', label:'Protein',  icon:'ph-egg-crack',
                choices:['Low','Some','High'] } ],           /* D-12: 3 levels */
  /* activity duration is handled in the time section, not here — length is a
     temporal fact, not context. Kept in CONTEXT so the picker can reuse it. */
  activity: [ { key:'dur',     label:'How long', icon:'ph-timer', temporal:true,
                choices:['5 min','10 min','15 min','20 min','30 min','45 min',
                         '1 hour','1.5 hours','2 hours+'] } ],
  symptom:  [ { key:'body',    label:'Where',    icon:'ph-person',
                choices:['Left side','Right side','Both sides','Whole body'] } ], /* C-02 */
  note:     []
};

/* What a new entry is called, per type. The tiles create an entry with the
   generic label and open the sheet on it, so the label is the first thing you
   can change — same "uncertainty drives disclosure" rule as an unconfirmed
   dose: lead with whatever the app does not yet know.
   Vocabulary follows glossary.html — patient words (kicked in, wearing off),
   not clinical synonyms. */
const NEW_LABEL = { dose:'Medication', activity:'Activity', meal:'Food',
                    symptom:'How I feel', note:'Photo' };
const SUGGEST = {
  dose:     ['Levodopa 100mg','Levodopa 150mg','Entacapone','Amantadine'],
  activity: ['Walk','Exercise','Housework','Errands','Rest'],
  meal:     ['Breakfast','Lunch','Dinner','Snack'],
  symptom:  ['Tremor','Stiffness','Froze in place','Low energy',
             'Meds kicked in','Wearing off'],
  note:     []
};

/* Basis, written for the person whose record it is. The sub-line names the
   consequence in the export, because that is the only reason the distinction exists. */
const BASIS = {
  asserted:{ opt:'I took it',        sub:'On the record as taken',
             status:'You confirmed this',      icon:'ph-check-circle' },
  declined:{ opt:"I didn't take it", sub:'On the record as skipped',
             status:'You said you didn\'t take this', icon:'ph-prohibit' },
  assumed: { opt:"I don't remember", sub:'Stays unconfirmed in your export',
             status:'Not confirmed',           icon:'ph-question' }
};
const BASIS_ORDER = ['asserted','declined','assumed'];

let currentDose = { name:'Levodopa 100mg', sched:'10:30' };  // one card max, never stacks
let active = null;          // {e, day} — the entry open in the detail sheet
let basisOpen = false;      // is the basis chooser expanded
let openField = null;       // which context field is showing its choices
let editingTime = false;    // is the big time swapped for numeric fields
let editingLabel = false;   // is the entry name swapped for a text field
/* Option 2, routed by list length. A secondary choice with 4+ options takes
   over the sheet as its own step with a back button (the Oura pattern); 2-3
   options stay inline as chips. Two behaviours, but each is the cheaper one
   for its case: a whole step to choose between Low/Some/High is theatre, and
   nine activity types inline is the tall sheet with two competing Done buttons
   Tutu hit. Threshold lives in one place so it can be tuned. */
let pickerStep = null;      // null | {kind:'label'} | {kind:'field', key}
const STEP_THRESHOLD = 4;
const usesStep = n => n >= STEP_THRESHOLD;
let freshEntry = null;      // the entry to mark as new in the next render
let lastFocus = null;
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)');

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowTime = () => { const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const sortDay = d => d.list.sort((a,b) => b.time.localeCompare(a.time));

/* ═════════ rendering — timeline ═════════ */
function markHTML(e){
  if (e.basis === 'assumed')
    return `<span class="emark assumed"><i class="ph ${ICON[e.type]}"></i></span>`;
  if (e.basis === 'declined')
    return `<span class="emark declined" style="color:${MARK}"><i class="ph ${ICON[e.type]}"></i></span>`;
  return `<span class="emark" style="background:${MARK}"><i class="ph-fill ${ICON[e.type]}"></i></span>`;
}
/* editable context first, then anything derived */
function metaPairs(e){
  const out = [];
  (CONTEXT[e.type] || []).forEach(f => {
    if (e.fields && e.fields[f.key]) out.push([f.icon, e.fields[f.key]]);
  });
  (e.meta || []).forEach(m => out.push(m));
  return out;
}
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
/* Show recorded_at only when it is far enough from occurred_at to change how
   the entry should be read. Under 20 minutes is the same moment in practice. */
function lagLabel(e){
  if (!e.recorded || e.recorded === e.time) return null;
  return Math.abs(toMin(e.recorded) - toMin(e.time)) >= 20 ? e.recorded : null;
}
function gapLabel(a, b){                      /* a is later, b is earlier */
  const d = toMin(a) - toMin(b);
  if (d < 75) return null;                    /* under ~an hour isn't worth saying */
  const h = Math.round(d/60);
  return h >= 24 ? null : h + 'h';
}
/* A removed entry leaves a marker where it stood, naming what went. Undo is
   right there and never expires — the alternative was a floating bar at the
   other end of the screen on a six-second fuse. */
function tombHTML(e, di, i){
  return `<div class="tomb">
    <span class="emark"><i class="ph ph-minus"></i></span>
    <span class="etime">${e.time}</span>
    <span class="tomb-card">
      <span class="tomb-text">Removed — <b>${esc(e.text)}</b></span>
      <button class="tomb-undo" onclick="undoRemove(${di},${i})">
        <i class="ph ph-arrow-counter-clockwise"></i>Undo</button>
    </span>
  </div>`;
}
function entryHTML(e, di, i){
  if (e.removed) return tombHTML(e, di, i);
  /* basis is surfaced only where it changes what the reader should believe:
     asserted is the default and carries no badge. */
  const note = e.basis === 'assumed'  ? '<span class="enote">Not confirmed</span>'
             : e.basis === 'declined' ? '<span class="enote">Reported not taken</span>' : '';
  const meta = metaPairs(e).map(m =>
      `<span><i class="ph ${m[0]}"></i>${esc(m[1])}</span>`).join('');
  const free = e.note ? `<span class="enote">${esc(e.note)}</span>` : '';
  const cls = 'entry' + (e === freshEntry ? ' fresh' : '');
  return `<button class="${cls}" onclick="tapEntry(${di},${i})">
    ${markHTML(e)}
    <span class="etime">${e.time}</span>
    <span class="ecard">
      <span class="etext">${esc(e.text)}</span>
      ${meta ? `<span class="emeta">${meta}</span>` : ''}
      ${note}${free}
      <span class="chev"><i class="ph ph-caret-right"></i></span>
    </span>
  </button>`;
}
/* returns the rail's INNER html — the caller wraps it, so nothing is string-surgeried */
function railInner(day, di){
  let h = '';
  day.list.forEach((e,i) => {
    if (i > 0){                               /* gaps read downward: newest first */
      const g = gapLabel(day.list[i-1].time, e.time);
      if (g) h += `<div class="gap"><span>${g}</span></div>`;
    }
    h += entryHTML(e, di, i);
  });
  return h;
}
function renderTimeline(){
  const tl = el('timeline');
  const anything = DAYS.some(d => d.list.length);
  if (!anything && !currentDose){
    tl.innerHTML = `<div class="empty">
      <div class="mark"><i class="ph ph-egg"></i></div>
      <h2>Your day, as it happens</h2>
      <p>Doses, movement, meals, how you feel — whatever you want to remember lands here,
      in the order it happened.</p></div>`;
    return;
  }
  let h = '';
  DAYS.forEach((day, di) => {
    if (!day.live && !day.list.length) return;          /* hide empty past days */
    h += `<div class="day-label">${esc(day.label)}</div>`;
    if (!day.list.length){
      h += '<div class="empty-day">Nothing logged yet today — the + button is ready when you are.</div>';
      return;
    }
    h += '<div class="rail">'
       + (day.live ? `<div class="now"><span>Now · ${nowTime()}</span></div>` : '')
       + railInner(day, di)
       + '</div>';
  });
  tl.innerHTML = h;
}
function renderCard(){
  const a = el('card-area');
  if (!currentDose){ a.innerHTML=''; return; }
  /* COPY CHANGE v2: v1's middle button said "Edit", which didn't tell you whether
     pressing it counted as a yes. It now sits below as its own path and says so. */
  a.innerHTML = `<div class="confirm">
    <div class="confirm-q">Did you take ${esc(currentDose.name.split(' ')[0])}?</div>
    <div class="confirm-meta">Scheduled ${currentDose.sched} · now ${nowTime()}</div>
    <div class="c-actions">
      <button class="c-btn primary" onclick="cardYes()">Yes</button>
      <button class="c-btn" onclick="cardNo()">No</button>
    </div>
    <button class="c-more" onclick="cardAdjust()">
      Yes, but not as scheduled<i class="ph ph-caret-right"></i></button>
    </div>`;
}

/* ═════════ rendering — detail sheet ═════════ */
function renderDetail(){
  if (!active) return;
  if (pickerStep){ renderPickerStep(); return; }
  const e = active.e;
  const fields = CONTEXT[e.type] || [];
  let h = '';

  /* — identity. The name is a value like any other, so it is editable here;
       without this the log-sheet tiles could only ever produce placeholders. — */
  const sugg = labelChoices(e.type);
  if (editingLabel){
    h += `<div class="sec">
      <div class="sec-h">What was it</div>
      <input class="lbl-in" id="lbl-in" value="${esc(e.text)}"
             aria-label="Name of this entry" oninput="setLabel(this.value)">
      ${sugg.length ? `<div class="chips">` + sugg.map(t =>
          `<button class="chip pick${t===e.text?' on':''}" onclick="pickLabel(${JSON.stringify(t).replace(/"/g,'&quot;')})">${esc(t)}</button>`
        ).join('') + `</div>` : ''}
      <button class="d-done" onclick="endLabelEdit()">Done</button>
    </div>`;
  } else {
    h += `<div class="d-head">
      ${markHTML(e)}
      <span class="d-title">
        <button class="d-title-btn" onclick="startLabelEdit()" aria-label="Edit the name">
          <strong>${esc(e.text)}</strong><i class="ph ph-pencil-simple"></i>
        </button>
        <span>${TYPE_NAME[e.type]} · ${esc(DAYS[active.day].label)}</span>
      </span></div>`;
  }

  /* — CORRECT: basis. Doses only. You cannot "assume" someone went for a walk,
       and pretending otherwise would put a control on screen that never earns
       its place. (`inferred` from sensors is post-MVP — see entry-schema.md.) — */
  if (e.type === 'dose'){
    const b = BASIS[e.basis];
    h += '<div class="sec"><div class="sec-h">The record</div>';
    if (!basisOpen){
      h += `<button class="basis-row" onclick="toggleBasis()">
        <i class="ph ${b.icon}"></i>
        <span class="bt"><b>${b.status}</b><em>${b.sub}</em></span>
        <span class="act">Change</span></button>`;
    } else {
      h += '<div class="opts">' + BASIS_ORDER.map(k => {
        const o = BASIS[k];
        return `<button class="opt${k===e.basis?' on':''}" onclick="setBasis('${k}')">
          <i class="ph ${k===e.basis?'ph-radio-button':'ph-circle'}"></i>
          <span class="ot"><b>${o.opt}</b><em>${o.sub}</em></span></button>`;
      }).join('') + '</div>';
    }
    h += '</div>';
  }

  h += timeSectionHTML(e);

  /* — ENRICH: context. Unset fields are dashed invitations; set fields are solid facts.
       Always rendered, because Note applies to every type even where CONTEXT is empty. — */
  h += '<div class="sec"><div class="sec-h">Context <span class="sec-opt">· optional</span></div>';
  h += '<div class="chips">';
  fields.filter(f => !f.temporal).forEach(f => {
    const v = e.fields && e.fields[f.key];
    h += `<button class="chip${v?' set':''}" onclick="toggleField('${f.key}')">
      <i class="ph ${f.icon}"></i>${v ? esc(v) : f.label}</button>`;
  });
  if (e.note === undefined)
    h += `<button class="chip" onclick="addNote()"><i class="ph ph-note-pencil"></i>Note</button>`;
  h += '</div>';

  /* the open field's choices, inline under the chip row */
  const f = fields.find(x => x.key === openField);
  if (f){
    const v = e.fields && e.fields[f.key];
    h += `<div class="picker"><span class="pl">${f.label}</span><div class="chips">`
      + f.choices.map(c =>
          `<button class="chip pick${v===c?' on':''}" onclick="setField('${f.key}',${JSON.stringify(c).replace(/"/g,'&quot;')})">${esc(c)}</button>`
        ).join('')
      + (v ? `<button class="chip pick" onclick="setField('${f.key}',null)">Clear</button>` : '')
      + '</div></div>';
  }
  if (e.note !== undefined)
    h += `<textarea class="note-in" placeholder="Anything worth remembering"
            oninput="setNote(this.value)">${esc(e.note)}</textarea>`;
  h += '</div>';

  /* — footer. Done sits lowest: it is the most-used control and the bottom of a
       bottom sheet is the most reachable place on the screen. — */
  h += `<div class="sec">
      <button class="d-done" onclick="closeSheets()">Done</button>
      <button class="d-remove" onclick="removeActive()">
        <i class="ph ph-trash"></i>Remove this entry</button>
    </div>`;

  el('detail-body').innerHTML = h;
}

/* ═════════ log sheet — two steps, both of them meaningful ═══════════════
   REVISED 2026-08-11 after Tutu pushed back, and the push-back was right.

   The old tiles logged "Activity" at the current time and opened the detail
   sheet to fix it. That satisfied "a complete stop in 1-2 taps" only on paper:
   an entry named after its own category records nothing, so the stop was
   hollow, and making it mean something cost MORE taps than saying it plainly
   would have. Simplifying entry was the whole point.

   The confirmation card works because the app has a genuine PREDICTION to
   confirm — a scheduled dose is a real proposal. A category is not a proposal.
   So the split is:

     app can propose something specific  → propose it, user confirms  (1 tap)
     app cannot                          → ask, with choices          (2 taps)

   Asking is not a blank form. The rule in AGENTS.md bans empty fields and a
   Save button; a short list of named options has neither. Picking IS the log —
   no sheet opens afterwards, nothing needs revising, and depth stays available
   by tapping the entry later.

   Short version, and the wording that should go in AGENTS.md:
   DEPTH IS OPTIONAL, IDENTITY IS NOT. A placeholder label must never reach the
   record. */
let logStep = null;          // null = categories · otherwise the chosen type

const TILES = [
  ['dose','ph-pill','Medication'], ['activity','ph-footprints','Activity'],
  ['meal','ph-fork-knife','Food & protein'], ['symptom','ph-waveform','How I feel']
];
const q = t => JSON.stringify(t).replace(/"/g,'&quot;');

/* ── what this user actually logs ────────────────────────────────────────
   Ranks past entries of a type by how often they appear, weighting anything
   logged near this clock time x3 — "Breakfast" and "Dinner" are the same
   category and never the same answer, and the thing that separates them is
   the hour. Reads only this user's own record; no averages, no comparison to
   other patients [C-10].

   This is not a model and does not trip C-14 (all MVP AI is user-initiated,
   nothing ambient): it is a count over local data, run on tap. It is however
   the natural first step toward the on-device work in ai-lab.html — the same
   predict-then-confirm shape, just cheaper.

   Deliberately returns NOTHING for a user with no history. An invented
   proposal is worse than an honest question, and a cold-start guess dressed
   as a prediction is how these features lose trust on day one. */
function rankLabels(type){
  const now = toMin(nowTime()), seen = new Map();
  DAYS.forEach(d => d.list.forEach(e => {
    if (e.type !== type || e.removed) return;
    const r = seen.get(e.text) || { n:0, near:0 };
    r.n++;
    const diff = Math.abs(toMin(e.time) - now);
    if (Math.min(diff, 1440 - diff) <= 120) r.near++;
    seen.set(e.text, r);
  }));
  return [...seen.entries()]
    .map(([text, r]) => ({ text, score: r.n + r.near * 3 }))
    .sort((a, b) => b.score - a.score)
    .map(x => x.text);
}
/* history first, then the generic list for anything they have not tried yet */
function labelChoices(type){
  const mine = rankLabels(type);
  return mine.concat((SUGGEST[type] || []).filter(t => !mine.includes(t)));
}

function renderLogSheet(){
  let h = '';
  if (!logStep){
    h += '<h2>Add to today</h2>';
    /* Photo names itself, so it stays one tap. In a real build the shutter
       comes first and this is what happens after it. */
    h += `<button class="strip" onclick="logNamed('note','Photo')">
      <span><span class="strip-name">Photo</span> <span class="sub">— snap now, caption optional</span></span>
    </button>`;
    h += '<div class="grid">' + TILES.map(([t,ico,name]) =>
      `<button class="tile" onclick="openCategory('${t}')">
        <span class="tile-ico" style="background:var(--mark)"><i class="ph-fill ${ico}"></i></span>
        <span class="tile-name">${name}</span></button>`).join('') + '</div>';
  } else {
    h += `<div class="log-head">
        <button class="backbtn" onclick="openCategory(null)" aria-label="Back">
          <i class="ph ph-caret-left"></i></button>
        <h2>${TYPE_NAME[logStep]}</h2>
      </div>`;
    h += '<div class="chips">' + labelChoices(logStep).map(t =>
      `<button class="chip pick" onclick="logNamed('${logStep}',${q(t)})">${esc(t)}</button>`
    ).join('') + '</div>';
    /* The one case the app genuinely cannot propose — so here, and only here,
       naming it yourself is the point rather than a chore. */
    h += `<button class="strip" onclick="logOther('${logStep}')">
      <span class="strip-name">Something else…</span></button>`;
  }
  /* The crisis row is reachable from both steps — it is never a detour. */
  h += `<div class="quick-row">
      <button class="quick" onclick="quickLog(this,'Froze in place','symptom')">Froze in place</button>
      <button class="quick" onclick="quickLog(this,'Low energy','symptom')">Low energy</button>
    </div>`;
  el('log-body').innerHTML = h;
}
/* The app proposes when it can and asks when it cannot — one rule, two paths.
   With history: prefill the detail sheet with the likeliest entry, already a
   complete valid record, and let the user confirm by walking away or change
   anything in place. Tapping the tile then Done is two taps, the same as the
   chooser, except the user also had every detail in front of them.
   Without history: the chooser, because there is nothing honest to propose. */
function openCategory(t){
  const guess = rankLabels(t)[0];
  if (!guess){ logStep = t; renderLogSheet(); return; }
  closeSheets();
  const e = { time:nowTime(), recorded:nowTime(), text:guess, type:t, basis:'asserted' };
  addEntry(e, 0);
  openDetail(e, 0);
}

/* Picking IS the log. Nothing opens afterwards. */
function logNamed(type, text){
  closeSheets();
  addEntry({ time:nowTime(), recorded:nowTime(), text, type, basis:'asserted' }, 0);
}
function logOther(type){
  closeSheets();
  const e = { time:nowTime(), recorded:nowTime(), text:NEW_LABEL[type],
              type, basis:'asserted' };
  addEntry(e, 0);
  openDetail(e, 0);
  startLabelEdit();
}

/* ═════════ time entry ═══════════════════════════════════════════════════
   Three ranges, three mechanisms, escalating only as far as needed:

     just happened   → nudges (±15m / ±1h). Nunes et al. 2016 (DG5) found
                       people with PD do better with multiple-tap than drag,
                       so a stepper beats a wheel. But DG3 caps multiple-tap
                       at ~10 taps before fatigue, which is exactly why nudges
                       alone cannot reach "yesterday afternoon".
     earlier today   → tap the time, type it. Numeric keypad, no drag anywhere.
     another day     → day chips.

   Nothing is hidden behind the escalation: all three are on screen at once.
   The date-entry accessibility literature is consistent that a picker widget
   must always be optional and typing must always be possible. */
const DAY_NAMES = ['Today','Yesterday'];

/* You cannot already have done something you have not done yet. Today is
   clamped to the current time; yesterday needs no clamp because every time
   yesterday is in the past. Scheduled-but-unrealised doses are the one thing
   that legitimately sits in the future, and they live on the confirmation
   card, not in this sheet — so nothing here needs an exemption. */
function canNudge(mins){
  const t = toMin(active.e.time);
  if (mins < 0) return t + mins >= 0;
  if (active.day !== 0) return true;
  return t + mins <= toMin(nowTime());
}
const isNow = () => active.day === 0 && active.e.time === nowTime();

function timeSectionHTML(e){
  const lag = lagLabel(e);
  const days = DAY_NAMES.map((d,i) =>
    `<button class="chip pick${i===active.day?' on':''}" onclick="setDay(${i})">${d}</button>`
  ).join('');

  const face = editingTime
    ? `<div class="timefields">
         <input class="tf" id="tf-h" inputmode="numeric" maxlength="2" value="${e.time.slice(0,2)}"
                aria-label="Hour" oninput="onTimeField('h',this)">
         <span class="tf-sep">:</span>
         <input class="tf" id="tf-m" inputmode="numeric" maxlength="2" value="${e.time.slice(3)}"
                aria-label="Minute" oninput="onTimeField('m',this)">
         <button class="tf-set" onclick="endTimeEdit()">Set</button>
       </div>`
    : `<button class="timeval-btn" onclick="startTimeEdit()" aria-label="Edit the time">
         <span class="timeval">${e.time}</span><i class="ph ph-pencil-simple"></i>
       </button>`;

  const nudges = [[-60,'−1h'],[-15,'−15m'],[15,'+15m'],[60,'+1h']].map(([m,l]) =>
    `<button class="nudge" onclick="nudge(${m})"${canNudge(m)?'':' disabled'}>${l}</button>`
  ).join('');

  return `<div class="sec"><div class="sec-h">When it happened</div>
    <div class="chips">${days}</div>
    ${face}
    ${lag ? `<div class="timesub">Logged at ${lag}</div>` : ''}
    ${editingTime ? '' : `<div class="nudges">${nudges}</div>
      <button class="nowbtn" onclick="setNow()"${isNow()?' disabled':''}>
        <i class="ph ph-crosshair-simple"></i>Set to now</button>
      ${durationRowHTML(e)}`}
  </div>`;
}

/* One exit only — back. Every choice commits the moment it is tapped, so there
   is nothing to confirm and no second Done competing with the sheet's own. */
function renderPickerStep(){
  const e = active.e;
  const isLabel = pickerStep.kind === 'label';
  const field = isLabel ? null : (CONTEXT[e.type]||[]).find(f => f.key === pickerStep.key);
  const title = isLabel ? `${TYPE_NAME[e.type]} type` : field.label;
  const choices = isLabel ? labelChoices(e.type) : field.choices;
  const current = isLabel ? e.text : (e.fields && e.fields[pickerStep.key]);

  let h = `<div class="log-head">
      <button class="backbtn" onclick="closePicker()" aria-label="Back">
        <i class="ph ph-caret-left"></i></button>
      <h2>${esc(title)}</h2>
    </div>`;
  h += '<div class="chips">' + choices.map(t =>
      `<button class="chip pick${t===current?' on':''}" onclick="${isLabel
        ? `pickLabel(${q(t)})` : `pickField('${pickerStep.key}',${q(t)})`}">${esc(t)}</button>`
    ).join('') + (current && !isLabel
      ? `<button class="chip pick" onclick="pickField('${pickerStep.key}',null)">Clear</button>` : '')
    + '</div>';
  /* naming it yourself belongs on this step, where the alternatives are */
  if (isLabel)
    h += `<input class="lbl-in" id="lbl-in" value="${esc(e.text)}"
            aria-label="Name of this entry" oninput="setLabel(this.value)">`;
  el('detail-body').innerHTML = h;
}
function openPicker(kind, key){ pickerStep = { kind, key }; renderDetail(); }
function closePicker(){ pickerStep = null; renderDetail(); }
function pickField(key, val){
  const e = active.e; e.fields = e.fields || {};
  if (val === null) delete e.fields[key]; else e.fields[key] = val;
  pickerStep = null; openField = null;
  renderDetail(); renderTimeline();
}

function durationRowHTML(e){
  const f = (CONTEXT[e.type] || []).find(x => x.temporal);
  if (!f) return '';
  const v = e.fields && e.fields[f.key];
  return `<div class="durrow">
      <span class="durlabel">${f.label}</span>
      <button class="chip${v?' set':''}" onclick="openPicker('field','${f.key}')">
        <i class="ph ${f.icon}"></i>${v ? esc(v) : 'Add'}</button>
    </div>`;
}

function startLabelEdit(){
  if (usesStep(labelChoices(active.e.type).length)){ openPicker('label'); return; }
  editingLabel = true; renderDetail();
  const n = el('lbl-in'); if (n){ n.focus(); n.select(); }
}
function endLabelEdit(){ editingLabel = false; renderDetail(); }
/* Live, like the time fields — writes through to the rail without re-rendering
   the sheet, which would take the caret with it. */
function setLabel(v){ active.e.text = v; renderTimeline(); }
function pickLabel(t){ active.e.text = t; editingLabel = false; pickerStep = null;
                       renderDetail(); renderTimeline(); }

function startTimeEdit(){
  editingTime = true; renderDetail();
  const h = el('tf-h'); if (h){ h.focus(); h.select(); }
}
function endTimeEdit(){ editingTime = false; renderDetail(); }
/* Writes live so the rail behind the sheet stays truthful, but never calls
   renderDetail — re-rendering mid-keystroke would destroy the field and the
   caret with it. The nudge row is hidden while editing precisely so its
   disabled states cannot drift out of sync with what is being typed. */
function onTimeField(which, node){
  const digits = node.value.replace(/\D/g,'').slice(0,2);
  if (digits !== node.value) node.value = digits;
  const cap = which === 'h' ? 23 : 59;
  let n = digits === '' ? 0 : Math.min(cap, parseInt(digits,10));
  const [hh,mm] = active.e.time.split(':');
  active.e.time = which === 'h' ? String(n).padStart(2,'0') + ':' + mm
                                : hh + ':' + String(n).padStart(2,'0');
  sortDay(DAYS[active.day]);
  renderTimeline();
  if (which === 'h' && digits.length === 2){ const m = el('tf-m'); if (m){ m.focus(); m.select(); } }
}
function setNow(){
  if (active.day !== 0) setDay(0);
  active.e.time = nowTime();
  sortDay(DAYS[0]);
  renderDetail(); renderTimeline();
}
/* Moving days moves the entry between lists — the day IS the list it lives in. */
function setDay(target){
  if (target === active.day) return;
  const e = active.e;
  DAYS[active.day].list = DAYS[active.day].list.filter(x => x !== e);
  DAYS[target].list.push(e);
  sortDay(DAYS[target]);
  active.day = target;
  renderDetail(); renderTimeline();
}

/* ═════════ detail actions — every one writes straight to the record ═════════ */
function openDetail(e, day){
  active = { e, day };
  basisOpen = (e.type === 'dose' && e.basis === 'assumed');  /* lead with what's unresolved */
  openField = null; editingTime = false; editingLabel = false; pickerStep = null;
  renderDetail();
  openSheet('sheet-detail');
}
function tapEntry(di, i){ openDetail(DAYS[di].list[i], di); }
function toggleBasis(){ basisOpen = !basisOpen; renderDetail(); }
function setBasis(k){
  active.e.basis = k;
  basisOpen = false;
  renderDetail(); renderTimeline();
}
function nudge(mins){
  if (!canNudge(mins)) return;                    /* the button is disabled; belt and braces */
  const e = active.e;
  let m = toMin(e.time) + mins;
  m = Math.max(0, Math.min(23*60 + 59, m));       /* stay inside the day — no silent rollover */
  e.time = String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  /* occurred_at only. e.recorded is untouched — the user is correcting when the
     dose happened, not rewriting when they told us about it. */
  sortDay(DAYS[active.day]);                      /* order is a property of the day, not the DOM */
  renderDetail(); renderTimeline();
}
function toggleField(key){
  const f = (CONTEXT[active.e.type]||[]).find(x => x.key === key);
  if (f && usesStep(f.choices.length)){ openPicker('field', key); return; }
  openField = (openField === key) ? null : key; renderDetail();
}
function setField(key, val){
  const e = active.e;
  e.fields = e.fields || {};
  if (val === null) delete e.fields[key]; else e.fields[key] = val;
  openField = null;
  renderDetail(); renderTimeline();
}
function addNote(){ active.e.note = ''; renderDetail(); }
function setNote(v){ active.e.note = v; renderTimeline(); }   /* no re-render: don't steal the caret */
/* The entry is not spliced out — it is flagged and kept in place, so the rail
   doesn't jump and the marker can name what went. One tombstone at a time:
   removing something else commits the previous removal. */
function removeActive(){
  const e = active.e;
  purgeTombs();
  e.removed = true;
  closeSheets();
  renderTimeline();
}
function purgeTombs(){ DAYS.forEach(d => { d.list = d.list.filter(x => !x.removed); }); }
function undoRemove(di, i){ delete DAYS[di].list[i].removed; renderTimeline(); }

/* ═════════ card actions — D-01 no reason ask · D-02 no stack, quiet collapse ═════════
   TIMESTAMPS. Two stamps, never one [docs/entry-schema.md]:
     time      = occurred_at, when the thing happened. Drives sort order.
     recorded  = recorded_at, when the user told us. Never drives sort order.
   The card proposes "Levodopa, 10:30" and Yes CONFIRMS THAT PROPOSAL — so the
   dose lands at 10:30, not at the moment of tapping. Stamping it "now" made Yes
   and "Yes, but not as scheduled" produce identical records, which left the
   second button with nothing to do. Nudging the time in the detail sheet moves
   occurred_at only; recorded_at is a fact about the past and never changes. */
function cardYes(){
  addEntry({ time:currentDose.sched, recorded:nowTime(),
             text:currentDose.name, type:'dose', basis:'asserted' }, 0);
  currentDose = null; renderCard();
}
function cardNo(){
  /* "No" is a REPORTED skip → basis:'declined'. Clinically valuable, and distinct
     from 'assumed' (we asked and got nothing back). */
  addEntry({ time:currentDose.sched, recorded:nowTime(),
             text:currentDose.name, type:'dose', basis:'declined' }, 0);
  currentDose = null; renderCard();
}
/* "Not exactly" = yes, with corrections. The entry lands as asserted at the
   SCHEDULED time (not now) — that is the fact being corrected — and the sheet
   opens on it. Two taps have already produced a complete, valid record; the
   sheet is where depth becomes available, never where it becomes required. */
function cardAdjust(){
  const e = { time:currentDose.sched, recorded:nowTime(),
              text:currentDose.name, type:'dose', basis:'asserted' };
  addEntry(e, 0);
  currentDose = null; renderCard();
  openDetail(e, 0);
}

/* a new dose falling due quietly collapses the unanswered one into the timeline as 'assumed' */
function demoAddDose(){
  if (currentDose){

    sortDay(DAYS[0]);

  }

}
function demoEmpty(){ DAYS.forEach(d => d.list = []); currentDose = null;
                      renderCard(); renderTimeline(); }

/* ═════════ logging ═════════
   No confirmation message. The entry appearing on the rail at the right time
   IS the confirmation — a toast saying "Walk — added" next to a visible Walk
   entry is the same fact twice, and the weaker copy of it. What the app owes
   the user instead is certainty about WHICH entry is new, and a guarantee it
   is actually on screen. Hence the highlight plus the scroll. */
function addEntry(e, di){
  DAYS[di].list.unshift(e);
  sortDay(DAYS[di]);
  freshEntry = e;
  renderTimeline();
  freshEntry = null;          /* only the render right after the add marks it */
  /* Scroll to the ENTRY, not to the top. Now that order follows occurred_at, a
     confirmed 10:30 dose logged at 17:19 lands partway down the rail — scrolling
     to the top would show the user everywhere except the thing they just did. */
  requestAnimationFrame(() => {
    const n = document.querySelector('.entry.fresh');
    if (!n) return;
    n.scrollIntoView({ block:'center',
                       behavior: REDUCED_MOTION.matches ? 'auto' : 'smooth' });
    /* Remove the class on the live node rather than re-rendering, so the wash
       fades out via .ecard's transition instead of being replaced mid-fade. */
    setTimeout(() => n.classList.remove('fresh'), 1800);
  });
}
function quickLog(btn, text, type){
  addEntry({ time:nowTime(), recorded:nowTime(), text, type, basis:'asserted' }, 0);
  btn.classList.add('flash');     /* confirmation at the source, where the eye is */
  setTimeout(()=> btn.classList.remove('flash'), 600);
  setTimeout(closeSheets, 260);
}

/* ═════════ sheets ═════════ */
const SHEETS = ['sheet-log','sheet-detail'];
function openSheet(id){
  if (id === 'sheet-log'){ logStep = null; renderLogSheet(); }
  lastFocus = document.activeElement;
  el('scrim').classList.add('open');
  SHEETS.forEach(s => el(s).classList.toggle('open', s === id));
  el(id).focus();                                   /* screen readers land inside the sheet */
}
function closeSheets(){
  el('scrim').classList.remove('open');
  SHEETS.forEach(s => el(s).classList.remove('open'));
  active = null; openField = null; editingTime = false; editingLabel = false; pickerStep = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

/* ── temporary tuning controls — remove before this becomes real ── */
function toggleTuner(){ el('tuner').classList.toggle('open'); }
function setScale(v){
  if (v) document.documentElement.dataset.textScale = v;
  else delete document.documentElement.dataset.textScale;
}
function setVar(name, value){ document.documentElement.style.setProperty(name, value); }

renderCard(); renderTimeline(); renderLogSheet();
